<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="favicon.ico" />
    <title>CatDock 登录</title>
    <style>
      /* ===== 亮色模式通用色 ===== */
      :root,
      :root[data-mode="light"] {
        --bg: #f3f5f9;
        --card: #ffffff;
        --border: #e5e8ef;
        --text: #1f2937;
        --text-2: #6b7280;
        --text-3: #9ca3af;
        --code-bg: #f8fafc;
        --input-bg: #fff;
        --ghost-bg: #fff;
        --ghost-hover: #f8fafc;
        --mask: rgba(17, 24, 39, 0.45);
        --radius: 12px;
        --shadow:
          0 1px 3px rgba(16, 24, 40, 0.08), 0 1px 2px rgba(16, 24, 40, 0.04);
      }
      /* ===== 暗色模式通用色 ===== */
      :root[data-mode="dark"] {
        --bg: #111827;
        --card: #1e293b;
        --border: #334155;
        --text: #e2e8f0;
        --text-2: #94a3b8;
        --text-3: #64748b;
        --code-bg: #0f172a;
        --input-bg: #0f172a;
        --ghost-bg: rgba(255, 255, 255, 0.08);
        --ghost-hover: rgba(255, 255, 255, 0.14);
        --mask: rgba(0, 0, 0, 0.6);
        --shadow: 0 1px 3px rgba(0, 0, 0, 0.3), 0 1px 2px rgba(0, 0, 0, 0.2);
      }

      /* ===== 墨绿（默认）===== */
      :root[data-palette="default"],
      :root:not([data-palette]) {
        --bg: #f0f7f4;
        --card: #ffffff;
        --border: #d1e7dc;
        --primary-soft: #ecfdf5;
        --code-bg: #f3f9f6;
        --primary: #059669;
        --primary-hover: #047857;
        --green: #059669;
        --green-soft: #ecfdf5;
        --amber: #d97706;
        --amber-soft: #fffbeb;
        --red: #dc2626;
        --red-soft: #fef2f2;
      }
      :root[data-palette="default"][data-mode="dark"],
      :root:not([data-palette])[data-mode="dark"] {
        --bg: #0e1f1a;
        --card: #14302a;
        --border: #1f4a3a;
        --code-bg: #0a1612;
        --input-bg: #0a1612;
        --primary: #10b981;
        --primary-hover: #059669;
        --primary-soft: #064e3b;
        --green: #10b981;
        --green-soft: #064e3b;
        --amber: #f59e0b;
        --amber-soft: #78350f;
        --red: #ef4444;
        --red-soft: #450a0a;
      }

      /* ===== 暖橙 ===== */
      :root[data-palette="orange"] {
        --bg: #fbf5f0;
        --card: #ffffff;
        --border: #f0ddd0;
        --primary-soft: #fff7ed;
        --code-bg: #fdf7f3;
        --primary: #ea580c;
        --primary-hover: #c2410c;
        --green: #16a34a;
        --green-soft: #ecfdf3;
        --amber: #ea580c;
        --amber-soft: #fff7ed;
        --red: #dc2626;
        --red-soft: #fef2f2;
      }
      :root[data-palette="orange"][data-mode="dark"] {
        --bg: #1a1410;
        --card: #2a1f18;
        --border: #3d2e22;
        --code-bg: #14100c;
        --input-bg: #14100c;
        --primary: #f97316;
        --primary-hover: #ea580c;
        --primary-soft: #431407;
        --green: #22c55e;
        --green-soft: #14532d;
        --amber: #f97316;
        --amber-soft: #431407;
        --red: #ef4444;
        --red-soft: #450a0a;
      }

      /* ===== 紫罗兰 ===== */
      :root[data-palette="violet"] {
        --bg: #f6f3fb;
        --card: #ffffff;
        --border: #e0d9f0;
        --primary-soft: #f5f3ff;
        --code-bg: #f9f7fd;
        --primary: #7c3aed;
        --primary-hover: #6d28d9;
        --green: #16a34a;
        --green-soft: #ecfdf3;
        --amber: #d97706;
        --amber-soft: #fffbeb;
        --red: #dc2626;
        --red-soft: #fef2f2;
      }
      :root[data-palette="violet"][data-mode="dark"] {
        --bg: #15102a;
        --card: #221a3d;
        --border: #362959;
        --code-bg: #100b1f;
        --input-bg: #100b1f;
        --primary: #a78bfa;
        --primary-hover: #8b5cf6;
        --primary-soft: #2e1065;
        --green: #22c55e;
        --green-soft: #14532d;
        --amber: #f59e0b;
        --amber-soft: #78350f;
        --red: #ef4444;
        --red-soft: #450a0a;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        background: var(--bg);
        color: var(--text);
        font-size: 14px;
        line-height: 1.6;
        min-height: 100vh;
      }

      /* ---------- 登录页 ---------- */
      .login-wrap {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .login-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        width: 100%;
        max-width: 380px;
        padding: 32px 28px;
      }
      .login-logo {
        text-align: center;
        font-size: 30px;
        margin-bottom: 6px;
      }
      .login-title {
        text-align: center;
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 15px;
      }
      .login-version {
        text-align: center;
        font-size: 12px;
        color: var(--text-3);
        margin-top: -10px;
        margin-bottom: 15px;
        letter-spacing: 0.5px;
      }
      .login-sub {
        text-align: center;
        color: var(--text-2);
        font-size: 12px;
        margin-bottom: 22px;
      }

      /* ---------- 表单元素 ---------- */
      label.field {
        display: block;
        margin-bottom: 14px;
      }
      label.field > span {
        display: block;
        font-size: 13px;
        font-weight: 500;
        color: var(--text);
        margin-bottom: 5px;
      }
      label.field > span .req {
        color: var(--red);
        margin-left: 2px;
      }
      input[type="text"],
      input[type="password"],
      textarea,
      select {
        width: 100%;
        padding: 9px 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        font-size: 14px;
        font-family: inherit;
        color: var(--text);
        background: var(--input-bg);
        outline: none;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }
      input:focus,
      textarea:focus,
      select:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.14);
      }
      textarea {
        resize: vertical;
        min-height: 42px;
      }
      .hint {
        font-size: 12px;
        color: var(--text-3);
        margin-top: 4px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 9px 16px;
        border: 1px solid transparent;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 500;
        font-family: inherit;
        cursor: pointer;
        transition:
          background 0.15s,
          border-color 0.15s,
          color 0.15s;
        white-space: nowrap;
      }
      .btn-primary {
        background: var(--primary);
        color: #fff;
      }
      .btn-primary:hover {
        background: var(--primary-hover);
      }
      .btn-danger {
        background: var(--red);
        color: #fff;
      }
      .btn-danger:hover {
        filter: brightness(1.12);
      }
      .btn-ghost {
        background: var(--ghost-bg);
        color: var(--text-2);
        border-color: var(--border);
      }
      .btn-ghost:hover {
        background: var(--ghost-hover);
        color: var(--text);
      }
      .btn-block {
        width: 100%;
      }
      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .alert {
        border-radius: 8px;
        padding: 9px 12px;
        font-size: 13px;
        margin-top: 12px;
        display: none;
        word-break: break-all;
      }
      .alert-error {
        background: var(--red-soft);
        color: var(--red);
        border: 1px solid #fecaca;
      }
      .alert-success {
        background: var(--green-soft);
        color: var(--green);
        border: 1px solid #bbf7d0;
      }
      .alert.show {
        display: block;
      }

      /* ---------- 主界面 ---------- */
      .topbar {
        background: var(--card);
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        z-index: 10;
      }
      .topbar-inner {
        max-width: 1080px;
        margin: 0 auto;
        padding: 12px 20px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .brand {
        font-size: 17px;
        font-weight: 600;
        cursor: pointer;
        user-select: none;
      }
      .brand .logo {
        margin-right: 4px;
      }
      .topbar .spacer {
        flex: 1;
      }
      .health {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--text-2);
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--text-3);
      }
      .dot.ok {
        background: var(--green);
        box-shadow: 0 0 0 3px var(--green-soft);
      }
      .dot.bad {
        background: var(--red);
        box-shadow: 0 0 0 3px var(--red-soft);
      }
      .user-chip {
        font-size: 13px;
        color: var(--text-2);
        background: var(--primary-soft);
        color: var(--primary);
        padding: 4px 10px;
        border-radius: 999px;
        font-weight: 500;
        cursor: pointer;
        user-select: none;
      }
      .user-chip::after {
        content: "▾";
        margin-left: 4px;
        font-size: 10px;
        opacity: 0.7;
      }
      .user-menu-wrap {
        position: relative;
        display: inline-flex;
      }
      .user-menu {
        display: none;
        position: absolute;
        right: 0;
        top: calc(100% + 8px);
        min-width: 120px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: var(--shadow);
        padding: 6px;
        z-index: 30;
      }
      .user-menu.show {
        display: block;
      }
      /* 外观菜单左对齐：与 CatDock 标题左边缘对齐（账号菜单保持右对齐） */
      #brandMenu {
        left: 0;
        right: auto;
      }
      .user-menu-item .btn-icon {
        margin-right: 6px;
      }
      .user-menu-item {
        display: block;
        width: 100%;
        text-align: left;
        padding: 8px 12px;
        border: none;
        border-radius: 8px;
        background: none;
        font-size: 13px;
        font-family: inherit;
        color: var(--text-2);
        cursor: pointer;
        white-space: nowrap;
      }
      .user-menu-item:hover {
        background: var(--ghost-bg);
        color: var(--primary);
      }
      .user-menu-item.danger {
        color: var(--red);
      }
      .user-menu-item.danger:hover {
        background: var(--red-soft);
        color: var(--red);
      }

      .container {
        max-width: 1080px;
        margin: 0 auto;
        padding: 20px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 16px;
        align-items: stretch;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 18px 20px;
        display: flex;
        flex-direction: column;
      }
      .card-title {
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 14px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .card-title .count {
        font-size: 12px;
        font-weight: 500;
        color: var(--primary);
        background: var(--primary-soft);
        padding: 1px 8px;
        border-radius: 999px;
      }

      details.adv {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 12px;
        margin-bottom: 14px;
      }
      details.adv summary {
        cursor: pointer;
        font-size: 13px;
        color: var(--text-2);
        user-select: none;
      }
      details.adv[open] summary {
        margin-bottom: 12px;
      }
      details.adv label.field {
        margin-top: 12px;
        margin-bottom: 0;
      }
      details.adv label.field:first-of-type {
        margin-top: 4px;
      }

      /* ---------- 任务列表 ---------- */
      .task-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        flex: 1;
        overflow-y: auto;
      }
      .task-item {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 14px;
        cursor: pointer;
        transition:
          border-color 0.15s,
          background 0.15s;
      }
      .task-item:hover {
        border-color: var(--primary);
        background: var(--primary-soft);
      }
      .task-row1 {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }
      .task-name {
        font-weight: 500;
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .task-id {
        font-size: 11px;
        color: var(--text-3);
        font-family: ui-monospace, Menlo, Consolas, monospace;
      }
      .badge {
        font-size: 12px;
        font-weight: 500;
        padding: 2px 9px;
        border-radius: 999px;
        white-space: nowrap;
      }
      .badge-running {
        background: var(--primary-soft);
        color: var(--primary);
      }
      .badge-collecting {
        background: var(--amber-soft);
        color: var(--amber);
      }
      .badge-done {
        background: var(--green-soft);
        color: var(--green);
      }
      .badge-failed {
        background: var(--red-soft);
        color: var(--red);
      }
      .badge-paused {
        background: var(--border);
        color: var(--text-2);
      }
      .task-actions {
        display: flex;
        gap: 4px;
      }
      .icon-btn {
        border: 1px solid var(--border);
        background: var(--ghost-bg);
        border-radius: 8px;
        width: 28px;
        height: 28px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 13px;
        color: var(--text-2);
        transition:
          border-color 0.15s,
          color 0.15s;
      }
      .icon-btn:hover {
        border-color: var(--primary);
        color: var(--primary);
      }
      .icon-btn.danger:hover {
        border-color: var(--red);
        color: var(--red);
      }
      .confirm-msg {
        font-size: 13px;
        color: var(--text-2);
        line-height: 1.7;
        margin: 0 0 18px;
        word-break: break-all;
      }
      .confirm-actions {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
      }
      .progress {
        height: 6px;
        background: var(--border);
        border-radius: 999px;
        overflow: hidden;
      }
      .progress-bar {
        height: 100%;
        background: var(--primary);
        border-radius: 999px;
        transition: width 0.4s ease;
      }
      .task-row2 {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 12px;
        color: var(--text-2);
        margin-top: 6px;
      }
      .task-row2 .pct {
        min-width: 38px;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      .empty {
        text-align: center;
        color: var(--text-3);
        padding: 34px 10px;
        font-size: 13px;
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .empty .icon {
        font-size: 28px;
        display: block;
        margin-bottom: 8px;
      }

      /* ---------- 弹窗 ---------- */
      .modal-mask {
        position: fixed;
        inset: 0;
        background: var(--mask);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        z-index: 100;
      }
      .modal-mask.show {
        display: flex;
      }
      .modal {
        background: var(--card);
        border-radius: var(--radius);
        width: 100%;
        max-width: 560px;
        max-height: 85vh;
        overflow-y: auto;
        padding: 22px 24px;
      }
      .modal-sm {
        max-width: 420px;
      }
      .modal-head {
        display: flex;
        align-items: center;
        margin-bottom: 16px;
      }
      .modal-head h3 {
        font-size: 16px;
        flex: 1;
      }
      .modal-close {
        border: none;
        background: none;
        font-size: 20px;
        color: var(--text-3);
        cursor: pointer;
        line-height: 1;
        padding: 4px;
      }
      .modal-close:hover {
        color: var(--text);
      }

      /* ---------- 过滤规则编辑器 ---------- */
      .filter-editor .fe-section {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 14px;
        margin-bottom: 12px;
      }
      .filter-editor .fe-head {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 8px;
      }
      .filter-editor .fe-switch {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }
      .filter-editor .fe-head .hint {
        margin: 0;
      }
      .filter-editor .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 8px;
      }
      .filter-editor .chips .chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        background: var(--primary-soft);
        color: var(--primary);
        border-radius: 999px;
        padding: 3px 6px 3px 10px;
        font-size: 12px;
        word-break: break-all;
      }
      .filter-editor .chips .chip button {
        border: none;
        background: none;
        color: inherit;
        cursor: pointer;
        font-size: 13px;
        line-height: 1;
        padding: 1px 3px;
        border-radius: 50%;
      }
      .filter-editor .chips .chip button:hover {
        color: var(--red);
      }
      .filter-editor .chips .empty-tip {
        font-size: 12px;
        color: var(--text-3);
      }
      .filter-editor .fe-add {
        display: flex;
        gap: 8px;
      }
      .filter-editor .fe-add input {
        flex: 1;
        min-width: 0;
      }
      .filter-editor .dd-rule {
        display: flex;
        gap: 6px;
        margin-bottom: 6px;
        align-items: center;
      }
      .filter-editor .dd-rule input {
        flex: 1;
        min-width: 0;
        font-family: ui-monospace, monospace;
        font-size: 12px;
      }
      .filter-editor .dd-rule .dd-arrow {
        color: var(--text-3);
        flex: none;
      }
      .filter-editor .dd-rule button {
        flex: none;
      }
      .detail-grid {
        display: grid;
        grid-template-columns: 96px 1fr;
        gap: 8px 12px;
        font-size: 13px;
      }
      .detail-grid dt {
        color: var(--text-2);
      }
      .detail-grid dd {
        word-break: break-all;
      }
      .detail-grid dd.mono {
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 12px;
      }
      .url-list {
        margin-top: 4px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .url-item {
        background: var(--code-bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 6px 10px;
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 12px;
        word-break: break-all;
      }
      .login-foot {
        text-align: center;
        font-size: 12px;
        color: var(--text-3);
        margin-top: 16px;
      }
      .theme-btns-login {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 50;
        display: flex;
        gap: 6px;
      }
      .theme-btns-login .btn {
        padding: 6px 10px;
        font-size: 16px;
      }

      /* ---------- 服务信息卡片 ---------- */
      .info-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px 24px;
        margin-bottom: 16px;
      }
      .info-item {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
      }
      .info-item .icon {
        font-size: 15px;
        flex-shrink: 0;
      }
      .info-item .label {
        color: var(--text-2);
      }
      .info-item .val {
        font-weight: 500;
      }
      .info-item .val.on {
        color: var(--green);
      }
      .info-item .val.off {
        color: var(--text-3);
      }
      .info-section {
        border-top: 1px solid var(--border);
        padding-top: 12px;
        margin-top: 4px;
      }
      .info-section-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 8px;
        text-align: center;
        letter-spacing: 1px;
      }
      .info-code {
        background: var(--code-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 14px;
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 12px;
        line-height: 1.7;
        overflow-x: auto;
        white-space: pre;
        color: var(--text);
      }
      .info-endpoints {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 12px;
      }
      .info-endpoint {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .info-endpoint .method {
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-weight: 600;
        color: var(--primary);
        min-width: 42px;
      }
      .info-endpoint .path {
        font-family: ui-monospace, Menlo, Consolas, monospace;
        color: var(--text);
      }
      .info-endpoint .desc {
        color: var(--text-2);
      }

      /* ================= 响应式适配（移动端） ================= */
      @media (max-width: 860px) {
        .container {
          grid-template-columns: minmax(0, 1fr);
        }
        /* 触控目标加大 */
        .btn {
          padding: 11px 16px;
        }
        /* iOS：输入框 >= 16px 防聚焦自动放大页面 */
        input[type="text"],
        input[type="password"],
        textarea,
        select {
          font-size: 16px;
        }
      }
      @media (max-width: 600px) {
        /* 顶栏单行：brand + 健康状态（仅圆点）靠左，用户名靠右，与 PC 分布一致 */
        .topbar-inner {
          padding: 10px 12px;
          gap: 6px;
        }
        .brand {
          font-size: 16px;
        }
        #healthText {
          display: none;
        }
        .user-chip {
          max-width: 90px;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
        }
        /* 任务操作按钮加大触控区 */
        .icon-btn {
          width: 34px;
          height: 34px;
          font-size: 15px;
        }
      }
      @media (max-width: 480px) {
        .container {
          padding: 12px;
          gap: 12px;
        }
        .card {
          padding: 14px;
        }
        .login-wrap {
          padding: 14px;
        }
        .login-card {
          padding: 26px 20px;
        }
        .info-grid {
          grid-template-columns: minmax(0, 1fr);
          gap: 6px 0;
        }
        .detail-grid {
          grid-template-columns: 76px minmax(0, 1fr);
        }
        /* 长命令自动换行，避免横向溢出 */
        .info-code {
          white-space: pre-wrap;
          word-break: break-all;
        }
        .modal-mask {
          padding: 10px;
          align-items: flex-end;
        }
        .modal {
          padding: 16px;
          max-height: 88vh;
        }
        .task-row2 {
          flex-wrap: wrap;
        }
        details.adv summary {
          padding: 4px 0;
        }
      }
    </style>
  </head>
  <body>
    <!-- ================= 登录视图 ================= -->
    <div class="login-wrap" id="loginView">
      <div class="theme-btns-login">
        <button class="btn btn-ghost" id="paletteBtnLogin" title="切换主题色">
          🎨
        </button>
        <button class="btn btn-ghost" id="modeBtnLogin" title="切换亮色/暗色">
          🌙
        </button>
      </div>
      <div class="login-card">
        <div class="login-logo">🐱</div>
        <div class="login-title">CatDock 网页控制台</div>
        <div class="login-version">v __VERSION__</div>

        <form id="loginForm" autocomplete="off">
          <label class="field">
            <span>认证密钥 (AUTH_KEY)<i class="req">*</i></span>
            <input type="password" id="loginKey" required />
          </label>
          <label class="field">
            <span>用户名<i class="req">*</i></span>
            <input
              type="text"
              id="loginUser"
              autocomplete="username"
              required
            />
          </label>
          <label class="field">
            <span>密码<i class="req">*</i></span>
            <input
              type="password"
              id="loginPwd"
              autocomplete="current-password"
              required
            />
          </label>
          <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
            登 录
          </button>
          <div class="alert alert-error" id="loginAlert"></div>
        </form>
      </div>
    </div>

    <!-- ================= 主视图 ================= -->
    <!-- 登录页无主视图 -->
    <div id="appView" style="display: none"></div>
        </div>

    <script>
      (function () {
        "use strict";

        // 页面由服务端托管在 /{prefix}/ 下，相对路径自动适配 URL 前缀
        var BASE = location.pathname.replace(/[^/]*$/, "");
        var LS = {
          token: "catdock_token",
          user: "catdock_user",
          role: "catdock_role",
          fmt: "catdock_fmt",
          palette: "catdock_palette",
          mode: "catdock_mode",
        };

        // 登录成功后仅持有短期访问令牌（POST /login 签发），
        // 密钥/账号/密码不再持久化，也不出现在 URL 中
        var creds = { token: "", user: "" };
        var pollTimer = null,
          healthTimer = null;

        var $ = function (id) {
          return document.getElementById(id);
        };

        // ---------- 主题 & 亮暗切换 ----------
        var PALETTES = [
          { id: "default", icon: "🟢", name: "墨绿" },
          { id: "orange", icon: "🟠", name: "暖橙" },
          { id: "violet", icon: "🟣", name: "紫罗兰" },
        ];
        function getPaletteIdx() {
          var saved = localStorage.getItem(LS.palette);
          for (var i = 0; i < PALETTES.length; i++)
            if (PALETTES[i].id === saved) return i;
          return 0;
        }
        function getMode() {
          var saved = localStorage.getItem(LS.mode);
          if (saved === "light" || saved === "dark") return saved;
          return window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        function applyPalette() {
          var idx = getPaletteIdx();
          var p = PALETTES[idx];
          document.documentElement.setAttribute("data-palette", p.id);
          ["paletteBtn", "paletteBtnLogin"].forEach(function (id) {
            var b = $(id);
            if (!b) return;
            var icon = b.querySelector(".btn-icon");
            if (icon) icon.textContent = p.icon;
            else b.textContent = p.icon;
          });
        }
        function applyMode() {
          var m = getMode();
          document.documentElement.setAttribute("data-mode", m);
          ["modeBtn", "modeBtnLogin"].forEach(function (id) {
            var b = $(id);
            if (!b) return;
            var icon = b.querySelector(".btn-icon");
            var emoji = m === "dark" ? "☀️" : "🌙";
            if (icon) icon.textContent = emoji;
            else b.textContent = emoji;
          });
        }
        function togglePalette() {
          var idx = getPaletteIdx();
          localStorage.setItem(
            LS.palette,
            PALETTES[(idx + 1) % PALETTES.length].id,
          );
          applyPalette();
        }
        function toggleMode() {
          var m = getMode();
          localStorage.setItem(LS.mode, m === "dark" ? "light" : "dark");
          applyMode();
        }
        applyPalette();
        applyMode();
        ["paletteBtn", "paletteBtnLogin"].forEach(function (id) {
          $(id) && $(id).addEventListener("click", togglePalette);
        });
        ["modeBtn", "modeBtnLogin"].forEach(function (id) {
          $(id) && $(id).addEventListener("click", toggleMode);
        });

        function esc(s) {
          return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
            return {
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            }[c];
          });
        }

        function showAlert(el, msg, ok) {
          el.textContent = msg;
          el.className = "alert show " + (ok ? "alert-success" : "alert-error");
        }
        function hideAlert(el) {
          el.className = "alert";
        }

        // ---------- API 封装 ----------
        function authHeaders() {
          var h = {};
          if (creds.token) h["Authorization"] = "Bearer " + creds.token;
          return h;
        }

        function apiGet(path) {
          return fetch(BASE + path, { method: "GET", headers: authHeaders() })
            .catch(function () {
              throw new Error(
                "无法连接服务器：连接被拒绝。可能 IP 已被封禁（服务器执行 banip show 查看并 banip del 解封），或地址前缀有误",
              );
            })
            .then(handleResp);
        }

        function apiPost(path, body) {
          var headers = Object.assign(
            { "Content-Type": "application/json" },
            authHeaders(),
          );
          return fetch(BASE + path, {
            method: "POST",
            headers: headers,
            body: JSON.stringify(body),
          })
            .catch(function () {
              throw new Error(
                "无法连接服务器：连接被拒绝。可能 IP 已被封禁（服务器执行 banip show 查看并 banip del 解封），或地址前缀有误",
              );
            })
            .then(handleResp);
        }

        function handleResp(resp) {
          return resp
            .json()
            .catch(function () {
              throw new Error("服务器响应格式错误");
            })
            .then(function (data) {
              if (!resp.ok || data.success === false) {
                throw new Error(
                  data.message || "请求失败 (HTTP " + resp.status + ")",
                );
              }
              return data;
            });
        }

        // ---------- 登录 ----------
        $("loginForm").addEventListener("submit", function (e) {
          e.preventDefault();
          var key = $("loginKey").value.trim();
          var user = $("loginUser").value.trim();
          var pwd = $("loginPwd").value;
          if (!key || !user || !pwd) {
            showAlert($("loginAlert"), "请填写完整的认证信息", false);
            return;
          }
          var btn = $("loginBtn");
          btn.disabled = true;
          btn.textContent = "登录中…";
          apiPost("login", { key: key, user: user, password: pwd })
            .then(function (data) {
              localStorage.setItem(LS.token, data.data.token);
              localStorage.setItem(LS.user, user);
              localStorage.setItem(LS.role, data.data.role || "user");
              $("loginPwd").value = "";
              $("loginKey").value = "";
              $("loginUser").value = "";
              // 根据角色跳转：管理员 → 管理控制台，用户 → 下载控制台
              if (data.data.role === "admin") {
                location.href = "admin.html";
              } else {
                location.href = "user.html";
              }
            })
            .catch(function (e) {
              showAlert($("loginAlert"), e.message, false);
            })
            .finally(function () {
              btn.disabled = false;
              btn.textContent = "登 录";
            });
        });

        // ---------- 启动：已登录则直接跳转对应页面 ----------
        var savedToken = localStorage.getItem(LS.token);
        if (savedToken) {
          if (localStorage.getItem(LS.role) === "admin") {
            location.href = "admin.html";
          } else {
            location.href = "user.html";
          }
        }
      })();
    </script>
  </body>
</html>
