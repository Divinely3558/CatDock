<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="favicon.ico" />
    <title>CatDock 登录</title>
    <style>
      /*__SHARED_CSS__*/

      /* ---------- 登录页 ---------- */
      .login-wrap {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .login-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        width: 100%;
        max-width: 380px;
        padding: 32px 28px;
      }
      .login-logo {
        text-align: center;
        font-size: 30px;
        margin-bottom: 6px;
      }
      .login-title {
        text-align: center;
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 15px;
      }
      .login-version {
        text-align: center;
        font-size: 12px;
        color: var(--text-3);
        margin-top: -10px;
        margin-bottom: 15px;
        letter-spacing: 0.5px;
      }

      .theme-btns-login {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 50;
        display: flex;
        gap: 6px;
      }
      .theme-btns-login .btn {
        padding: 6px 10px;
        font-size: 16px;
      }

      /* ================= 响应式适配（移动端） ================= */
      @media (max-width: 860px) {
        /* 触控目标加大 */
        .btn {
          padding: 11px 16px;
        }
        /* iOS：输入框 >= 16px 防聚焦自动放大页面 */
        input[type="text"],
        input[type="password"],
        textarea,
        select {
          font-size: 16px;
        }
      }
      @media (max-width: 480px) {
        .login-wrap {
          padding: 14px;
        }
        .login-card {
          padding: 26px 20px;
        }
      }
    </style>
    <script>
      /*__SHARED_JS__*/
    </script>
  </head>
  <body>
    <!-- ================= 登录视图 ================= -->
    <div class="login-wrap" id="loginView">
      <div class="theme-btns-login">
        <button class="btn btn-ghost" data-theme-palette title="切换主题色">
          🎨
        </button>
        <button class="btn btn-ghost" data-theme-mode title="切换亮色/暗色">
          🌙
        </button>
      </div>
      <div class="login-card">
        <div class="login-logo">🐱</div>
        <div class="login-title">CatDock 网页控制台</div>
        <div class="login-version">v __VERSION__</div>

        <form id="loginForm" autocomplete="off">
          <label class="field">
            <span>认证密钥 (AUTH_KEY)<i class="req">*</i></span>
            <input type="password" id="loginKey" required />
          </label>
          <label class="field">
            <span>用户名<i class="req">*</i></span>
            <input
              type="text"
              id="loginUser"
              autocomplete="username"
              required
            />
          </label>
          <label class="field">
            <span>密码<i class="req">*</i></span>
            <input
              type="password"
              id="loginPwd"
              autocomplete="current-password"
              required
            />
          </label>
          <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
            登 录
          </button>
          <div class="alert alert-error" id="loginAlert"></div>
        </form>
      </div>
    </div>

    <!-- ================= 主视图 ================= -->
    <!-- 登录页无主视图 -->
    <div id="appView" style="display: none"></div>
        </div>

    <script>
      (function () {
        "use strict";

        var LS = {
          token: "catdock_token",
          user: "catdock_user",
          role: "catdock_role",
          fmt: "catdock_fmt",
        };

        var $ = function (id) {
          return document.getElementById(id);
        };

        // 主题色板（会话随机）与亮暗切换、提示条与 API 封装等公共工具
        // 由 shared.js 注入的 window.CD 提供；
        // 登录页不注册 CD.onUnauthorized：登录失败只展示错误信息，不跳转

        // ---------- 登录 ----------
        $("loginForm").addEventListener("submit", function (e) {
          e.preventDefault();
          var key = $("loginKey").value.trim();
          var user = $("loginUser").value.trim();
          var pwd = $("loginPwd").value;
          if (!key || !user || !pwd) {
            CD.showAlert($("loginAlert"), "请填写完整的认证信息", false);
            return;
          }
          var btn = $("loginBtn");
          btn.disabled = true;
          btn.textContent = "登录中…";
          CD.apiPost("login", { key: key, user: user, password: pwd })
            .then(function (data) {
              localStorage.setItem(LS.token, data.data.token);
              localStorage.setItem(LS.user, user);
              localStorage.setItem(LS.role, data.data.role || "user");
              $("loginPwd").value = "";
              $("loginKey").value = "";
              $("loginUser").value = "";
              // 根据角色跳转：管理员 → 管理控制台，用户 → 下载控制台
              if (data.data.role === "admin") {
                location.href = "admin.html";
              } else {
                location.href = "user.html";
              }
            })
            .catch(function (e) {
              CD.showAlert($("loginAlert"), e.message, false);
            })
            .finally(function () {
              btn.disabled = false;
              btn.textContent = "登 录";
            });
        });

        // ---------- 启动：已登录则直接跳转对应页面 ----------
        var savedToken = localStorage.getItem(LS.token);
        if (savedToken) {
          if (localStorage.getItem(LS.role) === "admin") {
            location.href = "admin.html";
          } else {
            location.href = "user.html";
          }
        }
      })();
    </script>
  </body>
</html>
