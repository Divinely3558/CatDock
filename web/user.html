<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="favicon.ico" />
    <title>CatDock 下载控制台</title>
    <style>
      /*__SHARED_CSS__*/

      /* ---------- 自绘下拉框（输出格式：脱离原生 select，选项列表适配主题） ---------- */
      .dropdown {
        position: relative;
        width: 100%;
      }
      .dropdown-trigger {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 9px 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--input-bg);
        color: var(--text);
        font-size: 14px;
        font-family: inherit;
        cursor: pointer;
        outline: none;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }
      .dropdown-trigger:hover {
        border-color: var(--primary);
      }
      .dropdown-trigger:focus,
      .dropdown.open .dropdown-trigger {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px var(--focus-ring);
      }
      .dropdown-label {
        flex: 1;
        min-width: 0;
        text-align: left;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .dropdown-arrow {
        width: 0;
        height: 0;
        border-left: 4px solid transparent;
        border-right: 4px solid transparent;
        border-top: 5px solid var(--text-2);
        transition: transform 0.15s;
        flex-shrink: 0;
      }
      .dropdown.open .dropdown-arrow {
        transform: rotate(180deg);
      }
      .dropdown-menu {
        position: absolute;
        top: calc(100% + 4px);
        left: 0;
        right: 0;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: var(--shadow);
        overflow: hidden;
        z-index: 30;
        display: none;
        flex-direction: column;
        padding: 4px;
      }
      .dropdown.open .dropdown-menu {
        display: flex;
      }
      .dropdown-option {
        padding: 8px 10px;
        border-radius: 7px;
        font-size: 14px;
        color: var(--text);
        cursor: pointer;
        transition:
          background 0.12s,
          color 0.12s;
      }
      .dropdown-option:hover {
        background: var(--ghost-hover);
        color: var(--primary);
      }
      .dropdown-option.active {
        background: var(--primary-soft);
        color: var(--primary);
        font-weight: 600;
      }

      /* ---------- 主界面 ---------- */
      .health {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--text-2);
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--text-3);
      }
      .dot.ok {
        background: var(--green);
        box-shadow: 0 0 0 3px var(--green-soft);
      }
      .dot.bad {
        background: var(--red);
        box-shadow: 0 0 0 3px var(--red-soft);
      }
      .user-chip {
        color: var(--primary);
        background: var(--primary-soft);
      }

      .container {
        max-width: 1080px;
        margin: 0 auto;
        padding: 20px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 16px;
        align-items: stretch;
      }

      .card-title {
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 14px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .card-title .count {
        font-size: 12px;
        font-weight: 500;
        color: var(--primary);
        background: var(--primary-soft);
        padding: 1px 8px;
        border-radius: 999px;
      }

      details.adv {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 12px;
        margin-bottom: 14px;
      }
      details.adv summary {
        cursor: pointer;
        font-size: 13px;
        color: var(--text-2);
        user-select: none;
      }
      details.adv[open] summary {
        margin-bottom: 12px;
      }
      details.adv label.field {
        margin-top: 12px;
        margin-bottom: 0;
      }
      details.adv label.field:first-of-type {
        margin-top: 4px;
      }

      /* ---------- 任务列表 ---------- */
      .task-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        flex: 1;
        overflow-y: auto;
      }
      .task-item {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 14px;
        cursor: pointer;
        transition:
          border-color 0.15s,
          background 0.15s;
      }
      .task-item:hover {
        border-color: var(--primary);
        background: var(--primary-soft);
      }
      .task-row1 {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }
      .task-name {
        font-weight: 500;
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .task-id {
        font-size: 11px;
        color: var(--text-3);
        font-family: ui-monospace, Menlo, Consolas, monospace;
      }
      .badge {
        font-size: 12px;
        font-weight: 500;
        padding: 2px 9px;
        border-radius: 999px;
        white-space: nowrap;
      }
      .badge-running {
        background: var(--primary-soft);
        color: var(--primary);
      }
      .badge-collecting {
        background: var(--amber-soft);
        color: var(--amber);
      }
      .badge-done {
        background: var(--green-soft);
        color: var(--green);
      }
      .badge-failed {
        background: var(--red-soft);
        color: var(--red);
      }
      .badge-paused {
        background: var(--border);
        color: var(--text-2);
      }
      .task-actions {
        display: flex;
        gap: 4px;
      }
      .icon-btn {
        border: 1px solid var(--border);
        background: var(--ghost-bg);
        border-radius: 8px;
        width: 28px;
        height: 28px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 13px;
        color: var(--text-2);
        transition:
          border-color 0.15s,
          color 0.15s;
      }
      .icon-btn:hover {
        border-color: var(--primary);
        color: var(--primary);
      }
      .icon-btn.danger:hover {
        border-color: var(--red);
        color: var(--red);
      }
      .progress {
        height: 6px;
        background: var(--border);
        border-radius: 999px;
        overflow: hidden;
      }
      .progress-bar {
        height: 100%;
        background: var(--primary);
        border-radius: 999px;
        transition: width 0.4s ease;
      }
      .task-row2 {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 12px;
        color: var(--text-2);
        margin-top: 6px;
      }
      .task-row2 .pct {
        min-width: 38px;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      .empty {
        text-align: center;
        color: var(--text-3);
        padding: 34px 10px;
        font-size: 13px;
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .empty .icon {
        font-size: 28px;
        display: block;
        margin-bottom: 8px;
      }

      /* ---------- 弹窗 ---------- */
      .modal {
        background: var(--card);
        border-radius: var(--radius);
        width: 100%;
        max-width: 560px;
        max-height: 85vh;
        overflow-y: auto;
        padding: 22px 24px;
      }

      /* ---------- 通用弹层（与管理端 admin.html 共用同一套结构/逻辑） ---------- */
      /* 覆盖上方 .modal 的 max-height/overflow-y/宽度：
         通用弹层内容固定且短小，居中不滚动，避免移动端键盘弹出时
         视口缩小导致滚动条闪现/弹层位移 */
      .mask .modal {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        width: 100%;
        max-width: 400px;
        max-height: none;
        overflow: visible;
        padding: 22px 20px;
      }
      .mask .modal h3 {
        font-size: 15px;
        font-weight: 700;
        margin-bottom: 8px;
      }
      .mask .modal .msg {
        color: var(--text-2);
        font-size: 13px;
        margin-bottom: 16px;
        word-break: break-all;
      }
      .mask .modal .btns {
        display: flex;
        justify-content: flex-end;
        gap: 9px;
        margin-top: 6px;
      }
      .filter-editor .fe-head .hint {
        flex: none;
      }
      .detail-grid {
        display: grid;
        grid-template-columns: 96px 1fr;
        gap: 8px 12px;
        font-size: 13px;
      }
      .detail-grid dt {
        color: var(--text-2);
      }
      .detail-grid dd {
        word-break: break-all;
      }
      .detail-grid dd.mono {
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 12px;
      }
      .url-list {
        margin-top: 4px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .url-item {
        background: var(--code-bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 6px 10px;
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 12px;
        word-break: break-all;
      }

      /* ---------- 服务信息卡片 ---------- */
      .info-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px 24px;
        margin-bottom: 16px;
      }
      .info-item {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
      }
      .info-item .icon {
        font-size: 15px;
        flex-shrink: 0;
      }
      .info-item .label {
        color: var(--text-2);
      }
      .info-item .val {
        font-weight: 500;
      }
      .info-item .val.on {
        color: var(--green);
      }
      .info-item .val.off {
        color: var(--text-3);
      }
      .info-section {
        border-top: 1px solid var(--border);
        padding-top: 12px;
        margin-top: 4px;
      }
      .info-section-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 8px;
        text-align: center;
        letter-spacing: 1px;
      }
      .info-code {
        background: var(--code-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 14px;
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 12px;
        line-height: 1.7;
        overflow-x: auto;
        white-space: pre;
        color: var(--text);
      }
      .info-endpoints {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 12px;
      }
      .info-endpoint {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .info-endpoint .method {
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-weight: 600;
        color: var(--primary);
        min-width: 42px;
      }
      .info-endpoint .path {
        font-family: ui-monospace, Menlo, Consolas, monospace;
        color: var(--text);
      }
      .info-endpoint .desc {
        color: var(--text-2);
      }

      /* ================= 响应式适配（移动端） ================= */
      @media (max-width: 860px) {
        .container {
          grid-template-columns: minmax(0, 1fr);
        }
        /* 触控目标加大 */
        .btn {
          padding: 11px 16px;
        }
        /* iOS：输入框 >= 16px 防聚焦自动放大页面 */
        input[type="text"],
        input[type="password"],
        textarea,
        select,
        .dropdown-trigger {
          font-size: 16px;
        }
      }
      @media (max-width: 600px) {
        /* 顶栏单行：brand + 健康状态（仅圆点）靠左，用户名靠右，与 PC 分布一致 */
        .topbar-inner {
          padding: 10px 12px;
          gap: 6px;
        }
        .brand {
          font-size: 16px;
        }
        #healthText {
          display: none;
        }
        .user-chip {
          max-width: 90px;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
        }
        /* 任务操作按钮加大触控区 */
        .icon-btn {
          width: 34px;
          height: 34px;
          font-size: 15px;
        }
      }
      @media (max-width: 480px) {
        .container {
          padding: 12px;
          gap: 12px;
        }
        .card {
          padding: 14px;
        }
        .info-grid {
          grid-template-columns: minmax(0, 1fr);
          gap: 6px 0;
        }
        .detail-grid {
          grid-template-columns: 76px minmax(0, 1fr);
        }
        /* 长命令自动换行，避免横向溢出 */
        .info-code {
          white-space: pre-wrap;
          word-break: break-all;
        }
        .modal {
          padding: 16px;
          max-height: 88vh;
        }
        .task-row2 {
          flex-wrap: wrap;
        }
        details.adv summary {
          padding: 4px 0;
        }
      }
    </style>
    <script>
      /*__SHARED_JS__*/
    </script>
  </head>
  <body>
    <!-- ================= 主视图 ================= -->
    <div id="appView">
      <div class="topbar">
        <div class="topbar-inner">
          <span class="user-menu-wrap">
            <span class="brand" id="brandBtn" title="外观菜单"
              ><span class="logo">🐱</span>CatDock</span
            >
            <div class="user-menu" id="brandMenu">
              <button
                class="user-menu-item"
                data-theme-palette
                title="切换主题色"
              >
                <span class="btn-icon">🎨</span>主题色
              </button>
              <button
                class="user-menu-item"
                data-theme-mode
                title="切换亮色/暗色"
              >
                <span class="btn-icon">🌙</span>亮暗切换
              </button>
            </div>
          </span>
          <span class="health">
            <span class="dot" id="healthDot"></span
            ><span id="healthText">检测中…</span>
          </span>
          <span class="spacer"></span>
          <span class="user-menu-wrap">
            <span class="user-chip" id="userChip" title="账号菜单"></span>
            <div class="user-menu" id="userMenu">
              <button class="user-menu-item" id="menuPass">修改密码</button>
              <button class="user-menu-item" id="menuSwitch">切换用户</button>
              <button class="user-menu-item" id="menuFilters">过滤规则</button>
              <button class="user-menu-item danger" id="menuLogout">
                退出
              </button>
            </div>
          </span>
          <span class="topbar-break" aria-hidden="true"></span>
        </div>
      </div>

      <div class="container">
        <!-- 提交任务 -->
        <div class="card">
          <div class="card-title">➕ 新建下载任务</div>
          <form id="dlForm" autocomplete="off">
            <label class="field">
              <span>视频 URL<i class="req">*</i></span>
              <textarea
                id="fUrl"
                rows="2"
                placeholder="粘贴 m3u8 / 直链视频地址"
                required
              ></textarea>
            </label>
            <label class="field">
              <span>保存文件名</span>
              <input
                type="text"
                id="fName"
                placeholder="选填，如：我的视频（不含扩展名）"
              />
              <div class="hint">留空时服务端自动命名 download_任务ID</div>
            </label>
            <div class="field">
              <span>输出格式</span>
              <div class="dropdown" id="fFormatWrap">
                <input type="hidden" id="fFormat" value="mp4" />
                <button
                  type="button"
                  class="dropdown-trigger"
                  id="fFormatTrigger"
                  aria-haspopup="listbox"
                  aria-expanded="false"
                >
                  <span class="dropdown-label" id="fFormatLabel">MP4</span>
                  <span class="dropdown-arrow"></span>
                </button>
                <div class="dropdown-menu" id="fFormatMenu" role="listbox">
                  <div class="dropdown-option active" data-value="mp4">MP4</div>
                  <div class="dropdown-option" data-value="mkv">MKV</div>
                </div>
              </div>
              <div class="hint">
                选择最终视频的封装格式；猫抓插件请求体加
                <code>format</code> 字段可逐任务指定
              </div>
            </div>
            <details class="adv">
              <summary>高级选项（Referer / Cookie / UA，一般无需填写）</summary>
              <label class="field">
                <span>Referer</span>
                <input type="text" id="fReferer" placeholder="选填" />
              </label>
              <label class="field">
                <span>Cookie</span>
                <input type="text" id="fCookie" placeholder="选填" />
              </label>
              <label class="field">
                <span>User-Agent</span>
                <input type="text" id="fUa" placeholder="选填" />
              </label>
            </details>
            <button type="submit" class="btn btn-primary btn-block" id="dlBtn">
              ⬇ 添加下载任务
            </button>
            <div class="alert" id="dlAlert"></div>
          </form>
        </div>

        <!-- 任务列表 -->
        <div class="card">
          <div class="card-title">
            📋 进行中的任务 <span class="count" id="taskCount">0</span>
          </div>
          <div class="task-list" id="taskList"></div>
          <div class="empty" id="emptyState">
            <span class="icon">📭</span>
            暂无进行中的任务<br />
            <span style="font-size: 12px"
              >任务完成（成功/失败）后会自动移出列表</span
            >
          </div>
        </div>

        <!-- 服务信息 -->
        <div class="card" style="grid-column: 1 / -1" id="infoCard">
          <div class="card-title">ℹ️ 服务信息</div>
          <div id="infoBody">
            <div class="empty"><span class="icon">⏳</span>加载中…</div>
          </div>
        </div>
      </div>
    </div>

    <!-- ================= 任务详情弹窗（外框风格与管理端 admin.html 一致） ================= -->
    <div class="mask" id="modalMask">
      <div
        class="modal"
        style="max-width: 560px; max-height: 85vh; overflow-y: auto"
      >
        <h3>任务详情</h3>
        <dl class="detail-grid" id="modalBody"></dl>
      </div>
    </div>

    <!-- ================= 操作确认弹窗（外框风格与管理端 admin.html 一致） ================= -->
    <div class="mask" id="confirmMask">
      <div class="modal">
        <h3 id="confirmTitle">确认操作</h3>
        <p class="msg" id="confirmMsg"></p>
        <div class="btns">
          <button class="btn btn-ghost" id="confirmCancel">取消</button>
          <button class="btn" id="confirmOk">确认</button>
        </div>
      </div>
    </div>

    <!-- 通用弹层（表单/确认，结构与逻辑与管理端 admin.html 完全一致） -->
    <div class="mask" id="mask">
      <div class="modal">
        <h3 id="modalTitle"></h3>
        <div class="msg" id="modalMsg"></div>
        <div id="modalForm" style="margin-bottom: 16px"></div>
        <div class="btns">
          <button class="btn btn-ghost" id="modalCancel">取消</button>
          <button class="btn btn-primary" id="modalOk">确定</button>
        </div>
      </div>
    </div>
    <div class="toast" id="toast"></div>

    <!-- ================= 过滤规则弹窗（结构与管理端 admin.html 过滤模板一致） ================= -->
    <div class="mask" id="filterMask">
      <div
        class="modal"
        style="max-width: 520px; max-height: 85vh; overflow-y: auto"
      >
        <h3>我的过滤规则</h3>
        <div class="msg">仅对您自己的下载任务生效，保存后立即生效</div>
        <div class="filter-editor">
          <div class="fe-section">
            <div class="fe-head">
              <label class="fe-switch"
                ><input type="checkbox" id="kwEnabled" /> 拦截广告关键字</label
              >
              <span class="hint">URL 或文件名包含关键字时整个任务被拦截</span>
            </div>
            <div class="chips" id="kwChips"></div>
            <div class="fe-add">
              <input
                type="text"
                id="kwInput"
                placeholder="输入关键字，回车或逗号添加，可批量"
              />
              <button type="button" class="btn" id="kwAdd">添加</button>
            </div>
          </div>

          <div class="fe-section">
            <div class="fe-head">
              <label class="fe-switch"
                ><input type="checkbox" id="ffEnabled" />
                文件名过滤（删除关键字）</label
              >
              <span class="hint">从保存文件名中删除这些关键字，不拦截下载</span>
            </div>
            <div class="chips" id="ffChips"></div>
            <div class="fe-add">
              <input
                type="text"
                id="ffInput"
                placeholder="输入关键字，回车或逗号添加，可批量"
              />
              <button type="button" class="btn" id="ffAdd">添加</button>
            </div>
          </div>

          <div class="fe-section">
            <div class="fe-head">
              <label class="fe-switch"
                ><input type="checkbox" id="ddEnabled" />
                文件名去重（正则规则）</label
              >
              <span class="hint">按顺序应用正则替换；默认规则已去除重复段</span>
            </div>
            <div id="ddRules"></div>
            <button type="button" class="btn" id="ddAdd">+ 添加规则</button>
          </div>

          <div class="filter-actions">
            <button class="btn btn-primary" id="filterSave">
              保存过滤规则
            </button>
            <button type="button" class="btn btn-ghost" id="filterCancel">
              取消
            </button>
          </div>
          <div class="alert" id="filterAlert"></div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        "use strict";

        // 规范入口 /{prefix}/user.html（/user、/user/ 旧入口由服务端 302 跳转）
        // BASE 归一到 /{prefix}/，确保相对路径 API 正确
        var BASE = location.pathname.replace(/\/user(?:\.html)?\/?$/, "/");
        var LS = {
          token: "catdock_token",
          user: "catdock_user",
          role: "catdock_role",
          fmt: "catdock_fmt",
        };

        // 登录成功后仅持有短期访问令牌（POST /login 签发），
        // 密钥/账号/密码不再持久化，也不出现在 URL 中
        var creds = { token: "", user: "" };
        var pollTimer = null,
          healthTimer = null;

        var $ = function (id) {
          return document.getElementById(id);
        };

        // 主题色板（会话随机）与亮暗切换、esc/提示条/Toast/通用弹层/API 封装等
        // 公共工具由 shared.js 注入的 window.CD 提供

        // ---------- 登录 / 退出 ----------
        function loadCreds() {
          creds.token = localStorage.getItem(LS.token) || "";
          creds.user = localStorage.getItem(LS.user) || "";
          // 清理旧版本残留的明文凭证（key/user/pwd 已改为令牌模式）
          localStorage.removeItem("catdock_key");
          localStorage.removeItem("catdock_pwd");
          // 恢复上次选择的输出格式（自绘下拉框需同步显示标签与高亮项）
          var savedFmt = localStorage.getItem(LS.fmt);
          if (savedFmt === "mp4" || savedFmt === "mkv") setFormat(savedFmt);
        }

        function enterApp() {
          $("userChip").textContent = "👤 " + creds.user;
          startPolling();
          refreshTasks();
        }

        function tryLogin() {
          return CD.apiGet("tasks")
            .then(enterApp)
            .catch(function () {
              backToLogin();
            });
        }

        function backToLogin() {
          stopPolling();
          localStorage.removeItem(LS.token);
          localStorage.removeItem(LS.role);
          location.href = BASE + "login.html";
        }
        // API 层遇到 403（凭证失效）时由 shared.js 回调本函数
        CD.onUnauthorized = backToLogin;

        // ---------- 菜单关闭（展开/互斥/点外关闭由 shared.js 接管） ----------
        function closeUserMenu() {
          $("userMenu").classList.remove("show");
        }

        $("menuLogout").addEventListener("click", function () {
          closeUserMenu();
          // 先通知服务端吊销当前令牌（尽力而为，失败也继续清理本地）
          var done = function () {
            creds = { token: "", user: "" };
            backToLogin();
          };
          CD.apiPost("logout", {}).then(done).catch(done);
        });

        // ---------- 修改密码（弹层代码与管理端 admin.html 完全一致） ----------
        $("menuPass").addEventListener("click", function () {
          closeUserMenu();
          CD.openModal({
            title: "修改密码 - " + (creds.user || "用户"),
            fields: [
              {
                id: "old",
                label: "旧密码",
                type: "password",
                required: true,
                placeholder: "输入当前密码",
              },
              {
                id: "new1",
                label: "新密码（至少 6 位）",
                type: "password",
                required: true,
                placeholder: "输入新密码",
              },
              {
                id: "new2",
                label: "确认新密码",
                type: "password",
                required: true,
                placeholder: "再次输入新密码",
              },
            ],
            okText: "保存并重新登录",
            onOk: function (v) {
              if (!v.old || !v.new1) {
                CD.toast("旧密码与新密码不能为空", true);
                return false;
              }
              if (v.new1.length < 6) {
                CD.toast("新密码至少 6 位", true);
                return false;
              }
              if (v.new1 !== v.new2) {
                CD.toast("两次输入的新密码不一致", true);
                return false;
              }
              CD.apiPost("password", {
                oldPassword: v.old,
                newPassword: v.new1,
              })
                .then(function (data) {
                  // 改密即全端下线：本地清理后回到登录页
                  localStorage.removeItem(LS.token);
                  localStorage.removeItem(LS.user);
                  localStorage.removeItem(LS.role);
                  creds = { token: "", user: "" };
                  CD.toast(
                    (data.message || "密码已修改") + "，即将返回登录页…",
                  );
                  setTimeout(backToLogin, 1500);
                })
                .catch(function (e) {
                  CD.toast(e.message, true);
                  return false;
                });
            },
          });
        });

        // ---------- 切换用户（弹层代码与管理端 admin.html 完全一致） ----------
        // 输入目标账户用户名+密码（无需 AUTH_KEY），成功后吊销旧令牌并跳转
        $("menuSwitch").addEventListener("click", function () {
          closeUserMenu();
          CD.openModal({
            title: "切换用户",
            fields: [
              {
                id: "username",
                label: "目标用户名",
                required: true,
                placeholder: "输入要切换到的用户名",
              },
              {
                id: "password",
                label: "目标密码",
                type: "password",
                required: true,
                placeholder: "输入目标用户的密码",
              },
            ],
            okText: "切换并登录",
            onOk: function (v) {
              if (!v.username || !v.password) {
                CD.toast("用户名和密码不能为空", true);
                return false;
              }
              CD.apiPost("switch-user", {
                username: v.username,
                password: v.password,
              })
                .then(function (data) {
                  // 切换成功：旧令牌已被服务端吊销，本地替换为新令牌
                  localStorage.setItem(LS.token, data.data.token);
                  localStorage.setItem(LS.user, v.username);
                  localStorage.setItem(LS.role, data.data.role || "user");
                  creds = { token: data.data.token, user: v.username };
                  CD.toast("切换成功，正在跳转…");
                  // 按目标角色跳转：管理员 → 管理控制台，用户 → 刷新当前页
                  setTimeout(function () {
                    if (data.data.role === "admin") {
                      location.href = "admin.html";
                    } else {
                      location.reload();
                    }
                  }, 800);
                })
                .catch(function (e) {
                  CD.toast(e.message, true);
                  return false;
                });
            },
          });
        });

        // ---------- 过滤规则编辑器（与 admin 端共用 shared.js 的实现） ----------
        CD.initFilterEditor({ basePath: "filters" });

        // ---------- 输出格式自绘下拉框 ----------
        var fmtWrap = $("fFormatWrap");
        var fmtTrigger = $("fFormatTrigger");
        var fmtMenu = $("fFormatMenu");
        var fmtInput = $("fFormat");
        var fmtLabel = $("fFormatLabel");

        function setFormat(value, label) {
          fmtInput.value = value;
          var opts = fmtMenu.querySelectorAll(".dropdown-option");
          for (var i = 0; i < opts.length; i++) {
            var o = opts[i];
            var match = o.getAttribute("data-value") === value;
            o.classList.toggle("active", match);
            if (match && !label) label = o.textContent;
          }
          fmtLabel.textContent = label || value.toUpperCase();
        }

        function closeFormatMenu() {
          fmtWrap.classList.remove("open");
          fmtTrigger.setAttribute("aria-expanded", "false");
        }

        fmtTrigger.addEventListener("click", function (e) {
          e.preventDefault();
          var isOpen = fmtWrap.classList.toggle("open");
          fmtTrigger.setAttribute("aria-expanded", isOpen ? "true" : "false");
        });

        fmtMenu.addEventListener("click", function (e) {
          var opt = e.target;
          if (!opt.classList.contains("dropdown-option")) return;
          setFormat(opt.getAttribute("data-value"), opt.textContent);
          closeFormatMenu();
        });

        document.addEventListener("click", function (e) {
          if (
            fmtWrap.classList.contains("open") &&
            !fmtWrap.contains(e.target)
          ) {
            closeFormatMenu();
          }
        });
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape" && fmtWrap.classList.contains("open")) {
            closeFormatMenu();
          }
        });

        // ---------- 提交下载 ----------
        $("dlForm").addEventListener("submit", function (e) {
          e.preventDefault();
          var body = { url: $("fUrl").value.trim() };
          if (!body.url) {
            CD.showAlert($("dlAlert"), "URL 不能为空", false);
            return;
          }
          var name = $("fName").value.trim();
          var referer = $("fReferer").value.trim();
          var cookie = $("fCookie").value.trim();
          var ua = $("fUa").value.trim();
          var fmt = $("fFormat").value;
          if (name) body.saveName = name;
          if (referer) body.referer = referer;
          if (cookie) body.cookie = cookie;
          if (ua) body.userAgent = ua;
          if (fmt) {
            body.format = fmt;
            localStorage.setItem(LS.fmt, fmt);
          }

          var btn = $("dlBtn");
          btn.disabled = true;
          btn.textContent = "提交中…";
          CD.hideAlert($("dlAlert"));
          CD.apiPost("download", body)
            .then(function (data) {
              var msg = data.message || "下载任务已添加";
              if (data.blocked) {
                CD.showAlert($("dlAlert"), "🚫 " + msg, false);
              } else {
                CD.showAlert(
                  $("dlAlert"),
                  "✅ " +
                    msg +
                    (data.taskId ? "（任务 ID: " + data.taskId + "）" : ""),
                  true,
                );
                $("fUrl").value = "";
                refreshTasks();
              }
            })
            .catch(function (err) {
              CD.showAlert($("dlAlert"), "❌ " + err.message, false);
            })
            .finally(function () {
              btn.disabled = false;
              btn.textContent = "⬇ 添加下载任务";
            });
        });

        // ---------- 任务列表 ----------
        var STATUS_MAP = {
          collecting: ["收集中", "badge-collecting"],
          running: ["下载中", "badge-running"],
          paused: ["已暂停", "badge-paused"],
          done: ["已完成", "badge-done"],
          failed: ["失败", "badge-failed"],
        };

        function taskActionButtons(t) {
          var id = CD.esc(t.id);
          var btns = "";
          if (t.status === "paused") {
            btns +=
              '<button class="icon-btn" data-act="resume" data-id="' +
              id +
              '" title="继续下载">▶</button>';
          } else {
            btns +=
              '<button class="icon-btn" data-act="pause" data-id="' +
              id +
              '" title="暂停下载">⏸</button>';
          }
          btns +=
            '<button class="icon-btn danger" data-act="delete" data-id="' +
            id +
            '" title="删除任务及文件">🗑</button>';
          return '<span class="task-actions">' + btns + "</span>";
        }

        function refreshTasks() {
          return CD.apiGet("tasks")
            .then(function (data) {
              var tasks = data.data || [];
              $("taskCount").textContent = tasks.length;
              $("emptyState").style.display = tasks.length ? "none" : "";
              var list = $("taskList");
              list.innerHTML = tasks
                .map(function (t) {
                  var st = STATUS_MAP[t.status] || [t.status, "badge-running"];
                  var pct = Math.max(0, Math.min(100, Number(t.progress) || 0));
                  return (
                    '<div class="task-item" data-id="' +
                    CD.esc(t.id) +
                    '">' +
                    '<div class="task-row1">' +
                    '<span class="task-name" title="' +
                    CD.esc(t.save_name || "") +
                    '">' +
                    CD.esc(t.save_name || "(未命名)") +
                    "</span>" +
                    '<span class="badge ' +
                    st[1] +
                    '">' +
                    st[0] +
                    "</span>" +
                    "</div>" +
                    '<div class="progress"><div class="progress-bar" style="width:' +
                    pct +
                    '%"></div></div>' +
                    '<div class="task-row2">' +
                    '<span class="task-id">ID: ' +
                    CD.esc(t.id) +
                    "</span>" +
                    (t.user ? "<span>👤 " + CD.esc(t.user) + "</span>" : "") +
                    '<span style="flex:1"></span>' +
                    '<span class="pct">' +
                    pct +
                    "%</span>" +
                    taskActionButtons(t) +
                    "</div>" +
                    "</div>"
                  );
                })
                .join("");
            })
            .catch(function () {
              /* 403 已在 handleResp 处理；网络错误静默，等健康检查 */
            });
        }

        $("taskList").addEventListener("click", function (e) {
          var btn = e.target.closest(".icon-btn");
          if (btn) {
            e.stopPropagation();
            handleTaskAction(
              btn.getAttribute("data-act"),
              btn.getAttribute("data-id"),
            );
            return;
          }
          var item = e.target.closest(".task-item");
          if (item) showDetail(item.getAttribute("data-id"));
        });

        // ---------- 任务操作（暂停 / 继续 / 删除） ----------
        function handleTaskAction(act, id) {
          if (!id) return;
          if (act === "pause") {
            taskActionRequest("task/pause", id); // 暂停可逆，直接执行；仅删除弹确认框
          } else if (act === "resume") {
            taskActionRequest("task/resume", id);
          } else if (act === "delete") {
            showConfirm(
              "删除任务",
              "确定要删除该任务吗？<br><b>已下载的文件和临时文件将被一并删除，此操作不可恢复。</b>",
              true,
              function () {
                taskActionRequest("task/delete", id);
              },
            );
          }
        }

        function taskActionRequest(path, id) {
          CD.apiPost(path, { taskId: id })
            .then(function () {
              refreshTasks(); // 状态徽标变化即是操作反馈，成功无需弹窗
            })
            .catch(function (err) {
              CD.toast("操作失败：" + err.message, true);
            });
        }

        function showConfirm(title, msgHtml, danger, onOk) {
          $("confirmTitle").textContent = title;
          $("confirmMsg").innerHTML = msgHtml;
          $("confirmOk").className =
            "btn " + (danger ? "btn-danger" : "btn-primary");
          confirmOkHandler = onOk;
          $("confirmMask").classList.add("show");
        }

        var confirmOkHandler = null;
        function closeConfirm() {
          $("confirmMask").classList.remove("show");
          confirmOkHandler = null;
        }
        $("confirmOk").addEventListener("click", function () {
          var handler = confirmOkHandler;
          closeConfirm();
          if (handler) handler();
        });
        $("confirmCancel").addEventListener("click", closeConfirm);
        $("confirmMask").addEventListener("click", function (e) {
          if (e.target === $("confirmMask")) closeConfirm();
        });

        function showDetail(id) {
          CD.apiGet("tasks/" + encodeURIComponent(id))
            .then(function (data) {
              var t = data.data || {};
              var st = STATUS_MAP[t.status] || [t.status, "badge-running"];
              var urls =
                t.urls && t.urls.length ? t.urls : t.url ? [t.url] : [];
              var rows = [
                ["任务 ID", CD.esc(t.id), true],
                ["文件名", CD.esc(t.save_name || "(未命名)"), false],
                [
                  "状态",
                  '<span class="badge ' + st[1] + '">' + st[0] + "</span>",
                  false,
                ],
                ["进度", (Number(t.progress) || 0) + "%", false],
                ["所属用户", CD.esc(t.user || "-"), false],
                ["重试次数", String(t._retry_count || 0), false],
                ["链接数", String(urls.length), false],
              ];
              var html = rows
                .map(function (r) {
                  return (
                    "<dt>" +
                    r[0] +
                    "</dt><dd" +
                    (r[2] ? ' class="mono"' : "") +
                    ">" +
                    r[1] +
                    "</dd>"
                  );
                })
                .join("");
              html +=
                '<dt>全部链接</dt><dd><div class="url-list">' +
                urls
                  .map(function (u) {
                    return '<div class="url-item">' + CD.esc(u) + "</div>";
                  })
                  .join("") +
                "</div></dd>";
              $("modalBody").innerHTML = html;
              $("modalMask").classList.add("show");
            })
            .catch(function (err) {
              CD.toast("获取任务详情失败：" + err.message, true);
            });
        }

        $("modalMask").addEventListener("click", function (e) {
          if (e.target === $("modalMask"))
            $("modalMask").classList.remove("show");
        });

        // ---------- 健康检查 ----------
        function checkHealth() {
          return fetch(BASE + "health", { method: "GET" })
            .then(function (r) {
              return r.json();
            })
            .then(function (data) {
              var t = data.success ? "服务正常" : "服务异常";
              $("healthDot").className = "dot " + (data.success ? "ok" : "bad");
              $("healthText").textContent = t;
              $("healthDot").parentNode.setAttribute("title", t);
            })
            .catch(function () {
              $("healthDot").className = "dot bad";
              $("healthText").textContent = "连接失败";
              $("healthDot").parentNode.setAttribute("title", "连接失败");
            });
        }

        // ---------- 服务信息 ----------
        function loadConfigInfo() {
          CD.apiGet("config")
            .then(function (data) {
              var c = data.data || {};
              var on = function (v) {
                return v ? "on" : "off";
              };
              var yn = function (v) {
                return v ? "启用" : "禁用";
              };
              var chk = function (v) {
                return v ? "✓" : "✗";
              };

              // 配置概览
              var items = [
                ["🏷️", "版本", c.version || "未知"],
                ["📡", "API 端口", c.api_port],
                ["🔗", "URL 前缀", c.url_prefix || "(无)"],
                [
                  "🛡️",
                  "SSRF 防护",
                  yn(c.ssrf_protection),
                  on(c.ssrf_protection),
                ],
                ["📊", "最大并发", c.max_concurrent_tasks],
                [
                  "🎬",
                  "同视频模式",
                  yn(c.same_video_mode),
                  on(c.same_video_mode),
                ],
                [
                  "📋",
                  "规则",
                  "拦截关键字" +
                    chk(c.keywords_enabled) +
                    "(" +
                    c.ad_keyword_count +
                    ") 文件名过滤" +
                    chk(c.filename_filter_enabled) +
                    " 去重" +
                    chk(c.filename_dedup_enabled),
                ],
                [
                  "👥",
                  "用户",
                  c.user_count > 0 ? c.user_count + " 个" : "未创建",
                  c.user_count > 0 ? "" : "off",
                ],
              ];
              var html =
                '<div class="info-grid">' +
                items
                  .map(function (it) {
                    return (
                      '<div class="info-item"><span class="icon">' +
                      it[0] +
                      "</span>" +
                      '<span class="label">' +
                      it[1] +
                      ":</span>" +
                      '<span class="val ' +
                      (it[3] || "") +
                      '">' +
                      CD.esc(it[2]) +
                      "</span></div>"
                    );
                  })
                  .join("") +
                "</div>";

              // 猫抓插件配置
              var prefix = c.url_prefix || "";
              var sendUrl =
                "http://你的容器IP:" + c.api_port + "/" + prefix + "/download";
              html += '<div class="info-section">';
              html += '<div class="info-section-title">— 猫抓插件配置 —</div>';
              html +=
                '<div style="margin-bottom:8px;font-size:12px;color:var(--text-2);">发送地址：</div>';
              html += '<div class="info-code">' + CD.esc(sendUrl) + "</div>";
              html +=
                '<div style="margin:10px 0 6px;font-size:12px;color:var(--text-2);">请求体：</div>';
              html +=
                '<div class="info-code">' +
                CD.esc(
                  [
                    "{",
                    '  "url": "${url}",',
                    '  "saveName": "${title}_${now}",',
                    '  "referer": "${referer}",',
                    '  "cookie": "${cookie}",',
                    '  "userAgent": "${userAgent}",',
                    '  "key": "<你的AUTH_KEY>",',
                    '  "user": "<你的user>",',
                    '  "password": "<你的password>",',
                    '  "format": "mp4"',
                    "}",
                  ].join("\n"),
                ) +
                "</div>";
              html += "</div>";

              // API 接口
              html += '<div class="info-section">';
              html += '<div class="info-section-title">— API 接口 —</div>';
              var p = prefix ? "/" + prefix : "";
              var eps = [
                ["POST", p + "/download", "添加任务"],
                ["POST", p + "/login", "登录获取令牌"],
              ];
              html +=
                '<div class="info-endpoints">' +
                eps
                  .map(function (e) {
                    return (
                      '<div class="info-endpoint"><span class="method">' +
                      e[0] +
                      '</span><span class="path">' +
                      e[1] +
                      '</span><span class="desc">' +
                      e[2] +
                      "</span></div>"
                    );
                  })
                  .join("") +
                "</div>";
              html += "</div>";

              $("infoBody").innerHTML = html;
            })
            .catch(function () {
              $("infoBody").innerHTML =
                '<div class="empty"><span class="icon">⚠️</span>配置信息加载失败</div>';
            });
        }

        // ---------- 轮询（递归 setTimeout：上一次请求结束后才发下一次） ----------
        // 用 pollingActive 标志驱动递归调度，保证同一时刻只有一个请求在途，
        // 避免服务卡顿时 setInterval 请求堆积、凭证失效瞬间多个 403 触发 IP 封禁
        var pollingActive = false;

        function startPolling() {
          stopPolling();
          pollingActive = true;
          loadConfigInfo();
          scheduleTasks();
          scheduleHealth();
        }

        // 任务轮询：refreshTasks 结束（成功/失败/403 跳登录）后再等 3 秒
        function scheduleTasks() {
          if (!pollingActive) return;
          if (document.hidden) {
            pollTimer = setTimeout(scheduleTasks, 3000);
            return;
          }
          var next = function () {
            if (pollingActive) pollTimer = setTimeout(scheduleTasks, 3000);
          };
          refreshTasks().then(next, next);
        }

        // 健康检查：checkHealth 结束后再等 10 秒
        function scheduleHealth() {
          if (!pollingActive) return;
          if (document.hidden) {
            healthTimer = setTimeout(scheduleHealth, 10000);
            return;
          }
          checkHealth().then(
            function () {
              if (pollingActive)
                healthTimer = setTimeout(scheduleHealth, 10000);
            },
            function () {
              if (pollingActive)
                healthTimer = setTimeout(scheduleHealth, 10000);
            },
          );
        }

        function stopPolling() {
          pollingActive = false;
          if (pollTimer) {
            clearTimeout(pollTimer);
            pollTimer = null;
          }
          if (healthTimer) {
            clearTimeout(healthTimer);
            healthTimer = null;
          }
        }

        // ---------- 启动：校验令牌，无效则跳转登录页 ----------
        loadCreds();
        if (!creds.token) {
          location.href = BASE + "login.html";
        } else if (localStorage.getItem(LS.role) === "admin") {
          location.href = BASE + "admin.html";
        } else {
          tryLogin();
        }
      })();
    </script>
  </body>
</html>
