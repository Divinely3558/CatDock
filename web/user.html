<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="favicon.ico" />
    <title>CatDock 下载控制台</title>
    <style>
      /* ===== 亮色模式通用色 ===== */
      :root,
      :root[data-mode="light"] {
        --bg: #f3f5f9;
        --card: #ffffff;
        --border: #e5e8ef;
        --text: #1f2937;
        --text-2: #6b7280;
        --text-3: #9ca3af;
        --code-bg: #f8fafc;
        --input-bg: #fff;
        --ghost-bg: #fff;
        --ghost-hover: #f8fafc;
        --mask: rgba(17, 24, 39, 0.45);
        --radius: 12px;
        --shadow:
          0 1px 3px rgba(16, 24, 40, 0.08), 0 1px 2px rgba(16, 24, 40, 0.04);
      }
      /* ===== 暗色模式通用色 ===== */
      :root[data-mode="dark"] {
        --bg: #111827;
        --card: #1e293b;
        --border: #334155;
        --text: #e2e8f0;
        --text-2: #94a3b8;
        --text-3: #64748b;
        --code-bg: #0f172a;
        --input-bg: #0f172a;
        --ghost-bg: rgba(255, 255, 255, 0.08);
        --ghost-hover: rgba(255, 255, 255, 0.14);
        --mask: rgba(0, 0, 0, 0.6);
        --shadow: 0 1px 3px rgba(0, 0, 0, 0.3), 0 1px 2px rgba(0, 0, 0, 0.2);
      }

      /* ===== 墨绿（默认）===== */
      :root[data-palette="default"],
      :root:not([data-palette]) {
        --bg: #f0f7f4;
        --card: #ffffff;
        --border: #d1e7dc;
        --primary-soft: #ecfdf5;
        --code-bg: #f3f9f6;
        --primary: #059669;
        --primary-hover: #047857;
        --green: #059669;
        --green-soft: #ecfdf5;
        --amber: #d97706;
        --amber-soft: #fffbeb;
        --red: #dc2626;
        --red-soft: #fef2f2;
      }
      :root[data-palette="default"][data-mode="dark"],
      :root:not([data-palette])[data-mode="dark"] {
        --bg: #0e1f1a;
        --card: #14302a;
        --border: #1f4a3a;
        --code-bg: #0a1612;
        --input-bg: #0a1612;
        --primary: #10b981;
        --primary-hover: #059669;
        --primary-soft: #064e3b;
        --green: #10b981;
        --green-soft: #064e3b;
        --amber: #f59e0b;
        --amber-soft: #78350f;
        --red: #ef4444;
        --red-soft: #450a0a;
      }

      /* ===== 暖橙 ===== */
      :root[data-palette="orange"] {
        --bg: #fbf5f0;
        --card: #ffffff;
        --border: #f0ddd0;
        --primary-soft: #fff7ed;
        --code-bg: #fdf7f3;
        --primary: #ea580c;
        --primary-hover: #c2410c;
        --green: #16a34a;
        --green-soft: #ecfdf3;
        --amber: #ea580c;
        --amber-soft: #fff7ed;
        --red: #dc2626;
        --red-soft: #fef2f2;
      }
      :root[data-palette="orange"][data-mode="dark"] {
        --bg: #1a1410;
        --card: #2a1f18;
        --border: #3d2e22;
        --code-bg: #14100c;
        --input-bg: #14100c;
        --primary: #f97316;
        --primary-hover: #ea580c;
        --primary-soft: #431407;
        --green: #22c55e;
        --green-soft: #14532d;
        --amber: #f97316;
        --amber-soft: #431407;
        --red: #ef4444;
        --red-soft: #450a0a;
      }

      /* ===== 紫罗兰 ===== */
      :root[data-palette="violet"] {
        --bg: #f6f3fb;
        --card: #ffffff;
        --border: #e0d9f0;
        --primary-soft: #f5f3ff;
        --code-bg: #f9f7fd;
        --primary: #7c3aed;
        --primary-hover: #6d28d9;
        --green: #16a34a;
        --green-soft: #ecfdf3;
        --amber: #d97706;
        --amber-soft: #fffbeb;
        --red: #dc2626;
        --red-soft: #fef2f2;
      }
      :root[data-palette="violet"][data-mode="dark"] {
        --bg: #15102a;
        --card: #221a3d;
        --border: #362959;
        --code-bg: #100b1f;
        --input-bg: #100b1f;
        --primary: #a78bfa;
        --primary-hover: #8b5cf6;
        --primary-soft: #2e1065;
        --green: #22c55e;
        --green-soft: #14532d;
        --amber: #f59e0b;
        --amber-soft: #78350f;
        --red: #ef4444;
        --red-soft: #450a0a;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        background: var(--bg);
        color: var(--text);
        font-size: 14px;
        line-height: 1.6;
        min-height: 100vh;
      }

      /* ---------- 登录页 ---------- */
      .login-wrap {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .login-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        width: 100%;
        max-width: 380px;
        padding: 32px 28px;
      }
      .login-logo {
        text-align: center;
        font-size: 30px;
        margin-bottom: 6px;
      }
      .login-title {
        text-align: center;
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 15px;
      }
      .login-sub {
        text-align: center;
        color: var(--text-2);
        font-size: 12px;
        margin-bottom: 22px;
      }

      /* ---------- 表单元素 ---------- */
      label.field {
        display: block;
        margin-bottom: 14px;
      }
      label.field > span {
        display: block;
        font-size: 13px;
        font-weight: 500;
        color: var(--text);
        margin-bottom: 5px;
      }
      label.field > span .req {
        color: var(--red);
        margin-left: 2px;
      }
      input[type="text"],
      input[type="password"],
      textarea,
      select {
        width: 100%;
        padding: 9px 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        font-size: 14px;
        font-family: inherit;
        color: var(--text);
        background: var(--input-bg);
        outline: none;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }
      input:focus,
      textarea:focus,
      select:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.14);
      }
      textarea {
        resize: vertical;
        min-height: 42px;
      }
      .hint {
        font-size: 12px;
        color: var(--text-3);
        margin-top: 4px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 9px 16px;
        border: 1px solid transparent;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 500;
        font-family: inherit;
        cursor: pointer;
        transition:
          background 0.15s,
          border-color 0.15s,
          color 0.15s;
        white-space: nowrap;
      }
      .btn-primary {
        background: var(--primary);
        color: #fff;
      }
      .btn-primary:hover {
        background: var(--primary-hover);
      }
      .btn-danger {
        background: var(--red);
        color: #fff;
      }
      .btn-danger:hover {
        filter: brightness(1.12);
      }
      .btn-ghost {
        background: var(--ghost-bg);
        color: var(--text-2);
        border-color: var(--border);
      }
      .btn-ghost:hover {
        background: var(--ghost-hover);
        color: var(--text);
      }
      .btn-block {
        width: 100%;
      }
      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .alert {
        border-radius: 8px;
        padding: 9px 12px;
        font-size: 13px;
        margin-top: 12px;
        display: none;
        word-break: break-all;
      }
      .alert-error {
        background: var(--red-soft);
        color: var(--red);
        border: 1px solid #fecaca;
      }
      .alert-success {
        background: var(--green-soft);
        color: var(--green);
        border: 1px solid #bbf7d0;
      }
      .alert.show {
        display: block;
      }

      /* ---------- 主界面 ---------- */
      .topbar {
        background: var(--card);
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        z-index: 10;
      }
      .topbar-inner {
        max-width: 1080px;
        margin: 0 auto;
        padding: 12px 20px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .brand {
        font-size: 17px;
        font-weight: 600;
        cursor: pointer;
        user-select: none;
      }
      .brand .logo {
        margin-right: 4px;
      }
      .topbar .spacer {
        flex: 1;
      }
      .health {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--text-2);
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--text-3);
      }
      .dot.ok {
        background: var(--green);
        box-shadow: 0 0 0 3px var(--green-soft);
      }
      .dot.bad {
        background: var(--red);
        box-shadow: 0 0 0 3px var(--red-soft);
      }
      .user-chip {
        font-size: 13px;
        color: var(--text-2);
        background: var(--primary-soft);
        color: var(--primary);
        padding: 4px 10px;
        border-radius: 999px;
        font-weight: 500;
        cursor: pointer;
        user-select: none;
      }
      .user-chip::after {
        content: "▾";
        margin-left: 4px;
        font-size: 10px;
        opacity: 0.7;
      }
      .user-menu-wrap {
        position: relative;
        display: inline-flex;
      }
      .user-menu {
        display: none;
        position: absolute;
        right: 0;
        top: calc(100% + 8px);
        min-width: 120px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: var(--shadow);
        padding: 6px;
        z-index: 30;
      }
      .user-menu.show {
        display: block;
      }
      /* 外观菜单左对齐：与 CatDock 标题左边缘对齐（账号菜单保持右对齐） */
      #brandMenu {
        left: 0;
        right: auto;
      }
      .user-menu-item .btn-icon {
        margin-right: 6px;
      }
      .user-menu-item {
        display: block;
        width: 100%;
        text-align: left;
        padding: 8px 12px;
        border: none;
        border-radius: 8px;
        background: none;
        font-size: 13px;
        font-family: inherit;
        color: var(--text-2);
        cursor: pointer;
        white-space: nowrap;
      }
      .user-menu-item:hover {
        background: var(--ghost-bg);
        color: var(--primary);
      }
      .user-menu-item.danger {
        color: var(--red);
      }
      .user-menu-item.danger:hover {
        background: var(--red-soft);
        color: var(--red);
      }

      .container {
        max-width: 1080px;
        margin: 0 auto;
        padding: 20px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 16px;
        align-items: stretch;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 18px 20px;
        display: flex;
        flex-direction: column;
      }
      .card-title {
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 14px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .card-title .count {
        font-size: 12px;
        font-weight: 500;
        color: var(--primary);
        background: var(--primary-soft);
        padding: 1px 8px;
        border-radius: 999px;
      }

      details.adv {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 12px;
        margin-bottom: 14px;
      }
      details.adv summary {
        cursor: pointer;
        font-size: 13px;
        color: var(--text-2);
        user-select: none;
      }
      details.adv[open] summary {
        margin-bottom: 12px;
      }
      details.adv label.field {
        margin-top: 12px;
        margin-bottom: 0;
      }
      details.adv label.field:first-of-type {
        margin-top: 4px;
      }

      /* ---------- 任务列表 ---------- */
      .task-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        flex: 1;
        overflow-y: auto;
      }
      .task-item {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 14px;
        cursor: pointer;
        transition:
          border-color 0.15s,
          background 0.15s;
      }
      .task-item:hover {
        border-color: var(--primary);
        background: var(--primary-soft);
      }
      .task-row1 {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }
      .task-name {
        font-weight: 500;
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .task-id {
        font-size: 11px;
        color: var(--text-3);
        font-family: ui-monospace, Menlo, Consolas, monospace;
      }
      .badge {
        font-size: 12px;
        font-weight: 500;
        padding: 2px 9px;
        border-radius: 999px;
        white-space: nowrap;
      }
      .badge-running {
        background: var(--primary-soft);
        color: var(--primary);
      }
      .badge-collecting {
        background: var(--amber-soft);
        color: var(--amber);
      }
      .badge-done {
        background: var(--green-soft);
        color: var(--green);
      }
      .badge-failed {
        background: var(--red-soft);
        color: var(--red);
      }
      .badge-paused {
        background: var(--border);
        color: var(--text-2);
      }
      .task-actions {
        display: flex;
        gap: 4px;
      }
      .icon-btn {
        border: 1px solid var(--border);
        background: var(--ghost-bg);
        border-radius: 8px;
        width: 28px;
        height: 28px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 13px;
        color: var(--text-2);
        transition:
          border-color 0.15s,
          color 0.15s;
      }
      .icon-btn:hover {
        border-color: var(--primary);
        color: var(--primary);
      }
      .icon-btn.danger:hover {
        border-color: var(--red);
        color: var(--red);
      }
      .progress {
        height: 6px;
        background: var(--border);
        border-radius: 999px;
        overflow: hidden;
      }
      .progress-bar {
        height: 100%;
        background: var(--primary);
        border-radius: 999px;
        transition: width 0.4s ease;
      }
      .task-row2 {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 12px;
        color: var(--text-2);
        margin-top: 6px;
      }
      .task-row2 .pct {
        min-width: 38px;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      .empty {
        text-align: center;
        color: var(--text-3);
        padding: 34px 10px;
        font-size: 13px;
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .empty .icon {
        font-size: 28px;
        display: block;
        margin-bottom: 8px;
      }

      /* ---------- 弹窗 ---------- */
      .modal {
        background: var(--card);
        border-radius: var(--radius);
        width: 100%;
        max-width: 560px;
        max-height: 85vh;
        overflow-y: auto;
        padding: 22px 24px;
      }

      /* ---------- 通用弹层（与管理端 admin.html 共用同一套结构/逻辑） ---------- */
      .mask {
        position: fixed;
        inset: 0;
        background: var(--mask);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 100;
        padding: 20px;
      }
      .mask.show {
        display: flex;
      }
      /* 覆盖上方 .modal 的 max-height/overflow-y/宽度：
         通用弹层内容固定且短小，居中不滚动，避免移动端键盘弹出时
         视口缩小导致滚动条闪现/弹层位移 */
      .mask .modal {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        width: 100%;
        max-width: 400px;
        max-height: none;
        overflow: visible;
        padding: 22px 20px;
      }
      .mask .modal h3 {
        font-size: 15px;
        font-weight: 700;
        margin-bottom: 8px;
      }
      .mask .modal .msg {
        color: var(--text-2);
        font-size: 13px;
        margin-bottom: 16px;
        word-break: break-all;
      }
      .mask .modal .btns {
        display: flex;
        justify-content: flex-end;
        gap: 9px;
        margin-top: 6px;
      }

      /* ---------- Toast（与管理端一致） ---------- */
      .toast {
        position: fixed;
        left: 50%;
        bottom: 34px;
        transform: translateX(-50%) translateY(20px);
        background: var(--card);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 10px;
        padding: 9px 18px;
        font-size: 13px;
        box-shadow: var(--shadow);
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.2s,
          transform 0.2s;
        z-index: 200;
        max-width: 90vw;
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
      .toast.err {
        border-color: var(--red);
        color: var(--red);
      }

      /* ---------- 过滤规则编辑器 ---------- */
      .filter-editor .fe-section {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 14px;
        margin-bottom: 12px;
      }
      .filter-editor .fe-head {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 8px;
      }
      .filter-editor .fe-switch {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }
      .filter-editor .fe-head .hint {
        margin: 0;
      }
      .filter-editor .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 8px;
      }
      .filter-editor .chips .chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        background: var(--primary-soft);
        color: var(--primary);
        border-radius: 999px;
        padding: 3px 6px 3px 10px;
        font-size: 12px;
        word-break: break-all;
      }
      .filter-editor .chips .chip button {
        border: none;
        background: none;
        color: inherit;
        cursor: pointer;
        font-size: 13px;
        line-height: 1;
        padding: 1px 3px;
        border-radius: 50%;
      }
      .filter-editor .chips .chip button:hover {
        color: var(--red);
      }
      .filter-editor .chips .empty-tip {
        font-size: 12px;
        color: var(--text-3);
      }
      .filter-editor .fe-add {
        display: flex;
        gap: 8px;
      }
      .filter-editor .fe-add input {
        flex: 1;
        min-width: 0;
      }
      .filter-editor .dd-rule {
        display: flex;
        gap: 6px;
        margin-bottom: 6px;
        align-items: center;
      }
      .filter-editor .dd-rule input {
        flex: 1;
        min-width: 0;
        font-family: ui-monospace, monospace;
        font-size: 12px;
      }
      .filter-editor .dd-rule .dd-arrow {
        color: var(--text-3);
        flex: none;
      }
      .filter-editor .dd-rule button {
        flex: none;
      }
      .detail-grid {
        display: grid;
        grid-template-columns: 96px 1fr;
        gap: 8px 12px;
        font-size: 13px;
      }
      .detail-grid dt {
        color: var(--text-2);
      }
      .detail-grid dd {
        word-break: break-all;
      }
      .detail-grid dd.mono {
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 12px;
      }
      .url-list {
        margin-top: 4px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .url-item {
        background: var(--code-bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 6px 10px;
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 12px;
        word-break: break-all;
      }
      .login-foot {
        text-align: center;
        font-size: 12px;
        color: var(--text-3);
        margin-top: 16px;
      }
      .theme-btns-login {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 50;
        display: flex;
        gap: 6px;
      }
      .theme-btns-login .btn {
        padding: 6px 10px;
        font-size: 16px;
      }

      /* ---------- 服务信息卡片 ---------- */
      .info-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px 24px;
        margin-bottom: 16px;
      }
      .info-item {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
      }
      .info-item .icon {
        font-size: 15px;
        flex-shrink: 0;
      }
      .info-item .label {
        color: var(--text-2);
      }
      .info-item .val {
        font-weight: 500;
      }
      .info-item .val.on {
        color: var(--green);
      }
      .info-item .val.off {
        color: var(--text-3);
      }
      .info-section {
        border-top: 1px solid var(--border);
        padding-top: 12px;
        margin-top: 4px;
      }
      .info-section-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 8px;
        text-align: center;
        letter-spacing: 1px;
      }
      .info-code {
        background: var(--code-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 14px;
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 12px;
        line-height: 1.7;
        overflow-x: auto;
        white-space: pre;
        color: var(--text);
      }
      .info-endpoints {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 12px;
      }
      .info-endpoint {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .info-endpoint .method {
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-weight: 600;
        color: var(--primary);
        min-width: 42px;
      }
      .info-endpoint .path {
        font-family: ui-monospace, Menlo, Consolas, monospace;
        color: var(--text);
      }
      .info-endpoint .desc {
        color: var(--text-2);
      }

      /* ================= 响应式适配（移动端） ================= */
      @media (max-width: 860px) {
        .container {
          grid-template-columns: minmax(0, 1fr);
        }
        /* 触控目标加大 */
        .btn {
          padding: 11px 16px;
        }
        /* iOS：输入框 >= 16px 防聚焦自动放大页面 */
        input[type="text"],
        input[type="password"],
        textarea,
        select {
          font-size: 16px;
        }
      }
      @media (max-width: 600px) {
        /* 顶栏单行：brand + 健康状态（仅圆点）靠左，用户名靠右，与 PC 分布一致 */
        .topbar-inner {
          padding: 10px 12px;
          gap: 6px;
        }
        .brand {
          font-size: 16px;
        }
        #healthText {
          display: none;
        }
        .user-chip {
          max-width: 90px;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
        }
        /* 任务操作按钮加大触控区 */
        .icon-btn {
          width: 34px;
          height: 34px;
          font-size: 15px;
        }
      }
      @media (max-width: 480px) {
        .container {
          padding: 12px;
          gap: 12px;
        }
        .card {
          padding: 14px;
        }
        .login-wrap {
          padding: 14px;
        }
        .login-card {
          padding: 26px 20px;
        }
        .info-grid {
          grid-template-columns: minmax(0, 1fr);
          gap: 6px 0;
        }
        .detail-grid {
          grid-template-columns: 76px minmax(0, 1fr);
        }
        /* 长命令自动换行，避免横向溢出 */
        .info-code {
          white-space: pre-wrap;
          word-break: break-all;
        }
        .modal {
          padding: 16px;
          max-height: 88vh;
        }
        .task-row2 {
          flex-wrap: wrap;
        }
        details.adv summary {
          padding: 4px 0;
        }
      }
    </style>
  </head>
  <body>
    <!-- ================= 主视图 ================= -->
    <div id="appView">
      <div class="topbar">
        <div class="topbar-inner">
          <span class="user-menu-wrap">
            <span class="brand" id="brandBtn" title="外观菜单"
              ><span class="logo">🐱</span>CatDock</span
            >
            <div class="user-menu" id="brandMenu">
              <button class="user-menu-item" id="paletteBtn" title="切换主题色">
                <span class="btn-icon">🎨</span>主题色
              </button>
              <button class="user-menu-item" id="modeBtn" title="切换亮色/暗色">
                <span class="btn-icon">🌙</span>亮暗切换
              </button>
            </div>
          </span>
          <span class="health">
            <span class="dot" id="healthDot"></span
            ><span id="healthText">检测中…</span>
          </span>
          <span class="spacer"></span>
          <span class="user-menu-wrap">
            <span class="user-chip" id="userChip" title="账号菜单"></span>
            <div class="user-menu" id="userMenu">
              <button class="user-menu-item" id="menuPass">修改密码</button>
              <button class="user-menu-item" id="menuSwitch">切换用户</button>
              <button class="user-menu-item" id="menuFilters">过滤规则</button>
              <button class="user-menu-item danger" id="menuLogout">
                退出
              </button>
            </div>
          </span>
          <span class="topbar-break" aria-hidden="true"></span>
        </div>
      </div>

      <div class="container">
        <!-- 提交任务 -->
        <div class="card">
          <div class="card-title">➕ 新建下载任务</div>
          <form id="dlForm" autocomplete="off">
            <label class="field">
              <span>视频 URL<i class="req">*</i></span>
              <textarea
                id="fUrl"
                rows="2"
                placeholder="粘贴 m3u8 / 直链视频地址"
                required
              ></textarea>
            </label>
            <label class="field">
              <span>保存文件名</span>
              <input
                type="text"
                id="fName"
                placeholder="选填，如：我的视频（不含扩展名）"
              />
              <div class="hint">留空时服务端自动命名 download_任务ID</div>
            </label>
            <label class="field">
              <span>输出格式</span>
              <select id="fFormat">
                <option value="mp4">MP4</option>
                <option value="mkv">MKV</option>
              </select>
              <div class="hint">
                选择最终视频的封装格式；猫抓插件请求体加
                <code>format</code> 字段可逐任务指定
              </div>
            </label>
            <details class="adv">
              <summary>高级选项（Referer / Cookie / UA，一般无需填写）</summary>
              <label class="field">
                <span>Referer</span>
                <input type="text" id="fReferer" placeholder="选填" />
              </label>
              <label class="field">
                <span>Cookie</span>
                <input type="text" id="fCookie" placeholder="选填" />
              </label>
              <label class="field">
                <span>User-Agent</span>
                <input type="text" id="fUa" placeholder="选填" />
              </label>
            </details>
            <button type="submit" class="btn btn-primary btn-block" id="dlBtn">
              ⬇ 添加下载任务
            </button>
            <div class="alert" id="dlAlert"></div>
          </form>
        </div>

        <!-- 任务列表 -->
        <div class="card">
          <div class="card-title">
            📋 进行中的任务 <span class="count" id="taskCount">0</span>
          </div>
          <div class="task-list" id="taskList"></div>
          <div class="empty" id="emptyState">
            <span class="icon">📭</span>
            暂无进行中的任务<br />
            <span style="font-size: 12px"
              >任务完成（成功/失败）后会自动移出列表</span
            >
          </div>
        </div>

        <!-- 服务信息 -->
        <div class="card" style="grid-column: 1 / -1" id="infoCard">
          <div class="card-title">ℹ️ 服务信息</div>
          <div id="infoBody">
            <div class="empty"><span class="icon">⏳</span>加载中…</div>
          </div>
        </div>
      </div>
    </div>

    <!-- ================= 任务详情弹窗（外框风格与管理端 admin.html 一致） ================= -->
    <div class="mask" id="modalMask">
      <div class="modal" style="max-width: 560px; max-height: 85vh; overflow-y: auto">
        <h3>任务详情</h3>
        <dl class="detail-grid" id="modalBody"></dl>
      </div>
    </div>

    <!-- ================= 操作确认弹窗（外框风格与管理端 admin.html 一致） ================= -->
    <div class="mask" id="confirmMask">
      <div class="modal">
        <h3 id="confirmTitle">确认操作</h3>
        <p class="msg" id="confirmMsg"></p>
        <div class="btns">
          <button class="btn btn-ghost" id="confirmCancel">取消</button>
          <button class="btn" id="confirmOk">确认</button>
        </div>
      </div>
    </div>

    <!-- 通用弹层（表单/确认，结构与逻辑与管理端 admin.html 完全一致） -->
    <div class="mask" id="mask">
      <div class="modal">
        <h3 id="modalTitle"></h3>
        <div class="msg" id="modalMsg"></div>
        <div id="modalForm" style="margin-bottom: 16px"></div>
        <div class="btns">
          <button class="btn btn-ghost" id="modalCancel">取消</button>
          <button class="btn btn-primary" id="modalOk">确定</button>
        </div>
      </div>
    </div>
    <div class="toast" id="toast"></div>

    <!-- ================= 过滤规则弹窗（结构与管理端 admin.html 过滤模板一致） ================= -->
    <div class="mask" id="filterMask">
      <div class="modal" style="max-width: 520px; max-height: 85vh; overflow-y: auto">
        <h3>我的过滤规则</h3>
        <div class="msg">仅对您自己的下载任务生效，保存后立即生效</div>
        <div class="filter-editor">
          <div class="fe-section">
            <div class="fe-head">
              <label class="fe-switch"
                ><input type="checkbox" id="kwEnabled" /> 拦截广告关键字</label
              >
              <span class="hint">URL 或文件名包含关键字时整个任务被拦截</span>
            </div>
            <div class="chips" id="kwChips"></div>
            <div class="fe-add">
              <input
                type="text"
                id="kwInput"
                placeholder="输入关键字，回车或逗号添加，可批量"
              />
              <button type="button" class="btn" id="kwAdd">添加</button>
            </div>
          </div>

          <div class="fe-section">
            <div class="fe-head">
              <label class="fe-switch"
                ><input type="checkbox" id="ffEnabled" />
                文件名过滤（删除关键字）</label
              >
              <span class="hint">从保存文件名中删除这些关键字，不拦截下载</span>
            </div>
            <div class="chips" id="ffChips"></div>
            <div class="fe-add">
              <input
                type="text"
                id="ffInput"
                placeholder="输入关键字，回车或逗号添加，可批量"
              />
              <button type="button" class="btn" id="ffAdd">添加</button>
            </div>
          </div>

          <div class="fe-section">
            <div class="fe-head">
              <label class="fe-switch"
                ><input type="checkbox" id="ddEnabled" />
                文件名去重（正则规则）</label
              >
              <span class="hint">按顺序应用正则替换；默认规则已去除重复段</span>
            </div>
            <div id="ddRules"></div>
            <button type="button" class="btn" id="ddAdd">+ 添加规则</button>
          </div>

          <button class="btn btn-primary btn-block" id="filterSave">
            保存过滤规则
          </button>
          <div class="alert" id="filterAlert"></div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        "use strict";

        // 规范入口 /{prefix}/user.html（/user、/user/ 旧入口由服务端 302 跳转）
        // BASE 归一到 /{prefix}/，确保相对路径 API 正确
        var BASE = location.pathname.replace(/\/user(?:\.html)?\/?$/, "/");
        var LS = {
          token: "catdock_token",
          user: "catdock_user",
          role: "catdock_role",
          fmt: "catdock_fmt",
          palette: "catdock_palette",
          mode: "catdock_mode",
        };

        // 登录成功后仅持有短期访问令牌（POST /login 签发），
        // 密钥/账号/密码不再持久化，也不出现在 URL 中
        var creds = { token: "", user: "" };
        var pollTimer = null,
          healthTimer = null;

        var $ = function (id) {
          return document.getElementById(id);
        };

        // ---------- 主题 & 亮暗切换 ----------
        var PALETTES = [
          { id: "default", icon: "🟢", name: "墨绿" },
          { id: "orange", icon: "🟠", name: "暖橙" },
          { id: "violet", icon: "🟣", name: "紫罗兰" },
        ];
        function getPaletteIdx() {
          var saved = localStorage.getItem(LS.palette);
          for (var i = 0; i < PALETTES.length; i++)
            if (PALETTES[i].id === saved) return i;
          return 0;
        }
        function getMode() {
          var saved = localStorage.getItem(LS.mode);
          if (saved === "light" || saved === "dark") return saved;
          return window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        function applyPalette() {
          var idx = getPaletteIdx();
          var p = PALETTES[idx];
          document.documentElement.setAttribute("data-palette", p.id);
          ["paletteBtn", "paletteBtnLogin"].forEach(function (id) {
            var b = $(id);
            if (!b) return;
            var icon = b.querySelector(".btn-icon");
            if (icon) icon.textContent = p.icon;
            else b.textContent = p.icon;
          });
        }
        function applyMode() {
          var m = getMode();
          document.documentElement.setAttribute("data-mode", m);
          ["modeBtn", "modeBtnLogin"].forEach(function (id) {
            var b = $(id);
            if (!b) return;
            var icon = b.querySelector(".btn-icon");
            var emoji = m === "dark" ? "☀️" : "🌙";
            if (icon) icon.textContent = emoji;
            else b.textContent = emoji;
          });
        }
        function togglePalette() {
          var idx = getPaletteIdx();
          localStorage.setItem(
            LS.palette,
            PALETTES[(idx + 1) % PALETTES.length].id,
          );
          applyPalette();
        }
        function toggleMode() {
          var m = getMode();
          localStorage.setItem(LS.mode, m === "dark" ? "light" : "dark");
          applyMode();
        }
        applyPalette();
        applyMode();
        ["paletteBtn", "paletteBtnLogin"].forEach(function (id) {
          $(id) && $(id).addEventListener("click", togglePalette);
        });
        ["modeBtn", "modeBtnLogin"].forEach(function (id) {
          $(id) && $(id).addEventListener("click", toggleMode);
        });

        function esc(s) {
          return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
            return {
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            }[c];
          });
        }

        function showAlert(el, msg, ok) {
          el.textContent = msg;
          el.className = "alert show " + (ok ? "alert-success" : "alert-error");
        }
        function hideAlert(el) {
          el.className = "alert";
        }

        // ---------- Toast（与管理端一致） ----------
        var toastTimer = null;
        function toast(msg, isErr) {
          var el = $("toast");
          el.textContent = msg;
          el.className = "toast show" + (isErr ? " err" : "");
          clearTimeout(toastTimer);
          toastTimer = setTimeout(function () {
            el.className = "toast" + (isErr ? " err" : "");
          }, 2600);
        }

        // ---------- 通用弹层（与管理端 admin.html 共用同一套代码） ----------
        function openModal(spec) {
          $("modalTitle").textContent = spec.title || "提示";
          $("modalMsg").innerHTML = spec.msg || "";
          var form = $("modalForm");
          form.innerHTML = "";
          (spec.fields || []).forEach(function (f) {
            var lab = document.createElement("label");
            lab.className = "field";
            var span = document.createElement("span");
            span.textContent = f.label;
            if (f.required) span.innerHTML += '<span class="req">*</span>';
            var inp = document.createElement("input");
            inp.type = f.type || "text";
            inp.id = "mf_" + f.id;
            inp.placeholder = f.placeholder || "";
            // 统一 autocomplete="off"：避免移动端唤起密码管理器/自动填充条
            inp.autocomplete = "off";
            lab.appendChild(span);
            lab.appendChild(inp);
            form.appendChild(lab);
          });
          var okBtn = $("modalOk");
          okBtn.textContent = spec.okText || "确定";
          okBtn.className = "btn " + (spec.danger ? "btn-danger" : "btn-primary");
          $("mask").classList.add("show");
          setTimeout(function () {
            var first = form.querySelector("input");
            if (first) first.focus();
          }, 50);
          okBtn.onclick = function () {
            var values = {};
            for (var i = 0; i < (spec.fields || []).length; i++) {
              var f = spec.fields[i];
              values[f.id] = $("mf_" + f.id).value.trim();
            }
            if (spec.onOk && spec.onOk(values) === false) return;
            closeModal();
          };
          $("modalCancel").onclick = closeModal;
        }
        function closeModal() {
          $("mask").classList.remove("show");
        }

        // ---------- API 封装 ----------
        function authHeaders() {
          var h = {};
          if (creds.token) h["Authorization"] = "Bearer " + creds.token;
          return h;
        }

        function apiGet(path) {
          return fetch(BASE + path, { method: "GET", headers: authHeaders() })
            .catch(function () {
              throw new Error(
                "无法连接服务器：连接被拒绝。可能 IP 已被封禁（服务器执行 banip show 查看并 banip del 解封），或地址前缀有误",
              );
            })
            .then(handleResp);
        }

        function apiPost(path, body) {
          var headers = Object.assign(
            { "Content-Type": "application/json" },
            authHeaders(),
          );
          return fetch(BASE + path, {
            method: "POST",
            headers: headers,
            body: JSON.stringify(body),
          })
            .catch(function () {
              throw new Error(
                "无法连接服务器：连接被拒绝。可能 IP 已被封禁（服务器执行 banip show 查看并 banip del 解封），或地址前缀有误",
              );
            })
            .then(handleResp);
        }

        function handleResp(resp) {
          return resp
            .json()
            .catch(function () {
              throw new Error("服务器响应格式错误");
            })
            .then(function (data) {
              if (resp.status === 403) {
                // 凭证失效：跳转登录页
                backToLogin();
                throw new Error(data.message || "认证失败");
              }
              if (!resp.ok || data.success === false) {
                throw new Error(
                  data.message || "请求失败 (HTTP " + resp.status + ")",
                );
              }
              return data;
            });
        }

        // ---------- 登录 / 退出 ----------
        function loadCreds() {
          creds.token = localStorage.getItem(LS.token) || "";
          creds.user = localStorage.getItem(LS.user) || "";
          // 清理旧版本残留的明文凭证（key/user/pwd 已改为令牌模式）
          localStorage.removeItem("catdock_key");
          localStorage.removeItem("catdock_pwd");
          // 恢复上次选择的输出格式
          var savedFmt = localStorage.getItem(LS.fmt);
          if (savedFmt === "mp4" || savedFmt === "mkv")
            $("fFormat").value = savedFmt;
        }

        function enterApp() {
          $("userChip").textContent = "👤 " + creds.user;
          startPolling();
          refreshTasks();
        }

        function tryLogin() {
          return apiGet("tasks")
            .then(enterApp)
            .catch(function () {
              backToLogin();
            });
        }

        function backToLogin() {
          stopPolling();
          localStorage.removeItem(LS.token);
          localStorage.removeItem(LS.role);
          location.href = BASE + "login.html";
        }

        // ---------- 用户菜单（注销） ----------
        function closeUserMenu() {
          $("userMenu").classList.remove("show");
        }
        function closeBrandMenu() {
          $("brandMenu").classList.remove("show");
        }
        $("userChip").addEventListener("click", function (e) {
          e.stopPropagation();
          closeBrandMenu();
          $("userMenu").classList.toggle("show");
        });
        $("brandBtn").addEventListener("click", function (e) {
          e.stopPropagation();
          closeUserMenu();
          $("brandMenu").classList.toggle("show");
        });
        document.addEventListener("click", function (e) {
          if (!e.target.closest(".user-menu-wrap")) {
            closeUserMenu();
            closeBrandMenu();
          }
        });

        $("menuLogout").addEventListener("click", function () {
          closeUserMenu();
          // 先通知服务端吊销当前令牌（尽力而为，失败也继续清理本地）
          var done = function () {
            creds = { token: "", user: "" };
            backToLogin();
          };
          apiPost("logout", {}).then(done).catch(done);
        });

        // ---------- 修改密码（弹层代码与管理端 admin.html 完全一致） ----------
        $("menuPass").addEventListener("click", function () {
          closeUserMenu();
          openModal({
            title: "修改密码 - " + (creds.user || "用户"),
            fields: [
              {
                id: "old",
                label: "旧密码",
                type: "password",
                required: true,
                placeholder: "输入当前密码",
              },
              {
                id: "new1",
                label: "新密码（至少 6 位）",
                type: "password",
                required: true,
                placeholder: "输入新密码",
              },
              {
                id: "new2",
                label: "确认新密码",
                type: "password",
                required: true,
                placeholder: "再次输入新密码",
              },
            ],
            okText: "保存并重新登录",
            onOk: function (v) {
              if (!v.old || !v.new1) {
                toast("旧密码与新密码不能为空", true);
                return false;
              }
              if (v.new1.length < 6) {
                toast("新密码至少 6 位", true);
                return false;
              }
              if (v.new1 !== v.new2) {
                toast("两次输入的新密码不一致", true);
                return false;
              }
              apiPost("password", {
                oldPassword: v.old,
                newPassword: v.new1,
              })
                .then(function (data) {

        // ---------- 过滤规则编辑器 ----------
        var filterState = {
          keywords: { enabled: false, list: [] },
          filename_filter: { enabled: false, list: [] },
          filename_dedup: { enabled: false, rules: [] },
        };

        function renderChips(key, listId, inputId) {
          var wrap = $(listId);
          wrap.innerHTML = "";
          var list = filterState[key].list;
          if (!list.length) {
            var tip = document.createElement("span");
            tip.className = "empty-tip";
            tip.textContent = "暂无关键字";
            wrap.appendChild(tip);
            return;
          }
          list.forEach(function (item, idx) {
            var chip = document.createElement("span");
            chip.className = "chip";
            var text = document.createElement("span");
            text.textContent = item;
            var del = document.createElement("button");
            del.type = "button";
            del.textContent = "✕";
            del.title = "删除";
            del.onclick = function () {
              filterState[key].list.splice(idx, 1);
              renderChips(key, listId, inputId);
            };
            chip.appendChild(text);
            chip.appendChild(del);
            wrap.appendChild(chip);
          });
        }

        function addKeywords(key, listId, inputId) {
          var raw = $(inputId).value.trim();
          if (!raw) return;
          raw
            .split(/[,，\n]/)
            .map(function (s) {
              return s.trim();
            })
            .filter(function (s) {
              return s;
            })
            .forEach(function (s) {
              if (filterState[key].list.indexOf(s) === -1)
                filterState[key].list.push(s);
            });
          $(inputId).value = "";
          renderChips(key, listId, inputId);
        }

        function renderDdRules() {
          var wrap = $("ddRules");
          wrap.innerHTML = "";
          var rules = filterState.filename_dedup.rules;
          rules.forEach(function (rule, idx) {
            var row = document.createElement("div");
            row.className = "dd-rule";
            var p = document.createElement("input");
            p.type = "text";
            p.placeholder = "正则 pattern";
            p.value = rule.pattern || "";
            p.oninput = function () {
              rules[idx].pattern = p.value;
            };
            var arrow = document.createElement("span");
            arrow.className = "dd-arrow";
            arrow.textContent = "→";
            var r = document.createElement("input");
            r.type = "text";
            r.placeholder = "替换为";
            r.value = rule.replacement || "";
            r.oninput = function () {
              rules[idx].replacement = r.value;
            };
            var del = document.createElement("button");
            del.type = "button";
            del.className = "btn";
            del.textContent = "✕";
            del.title = "删除规则";
            del.onclick = function () {
              rules.splice(idx, 1);
              renderDdRules();
            };
            row.appendChild(p);
            row.appendChild(arrow);
            row.appendChild(r);
            row.appendChild(del);
            wrap.appendChild(row);
          });
        }

              true,
              function () {
                taskActionRequest("task/delete", id);
              },
            );
          }

        // ---------- 轮询（递归 setTimeout：上一次请求结束后才发下一次） ----------
        // 用 pollingActive 标志驱动递归调度，保证同一时刻只有一个请求在途，
        // 避免服务卡顿时 setInterval 请求堆积、凭证失效瞬间多个 403 触发 IP 封禁
        var pollingActive = false;

        function startPolling() {
          stopPolling();
          pollingActive = true;
          loadConfigInfo();
          scheduleTasks();
          scheduleHealth();
        }

        // 任务轮询：refreshTasks 结束（成功/失败/403 跳登录）后再等 3 秒
        function scheduleTasks() {
          if (!pollingActive) return;
          if (document.hidden) {
            pollTimer = setTimeout(scheduleTasks, 3000);
            return;
          }
          var next = function () {
            if (pollingActive) pollTimer = setTimeout(scheduleTasks, 3000);
          };
          refreshTasks().then(next, next);
        }

        // 健康检查：checkHealth 结束后再等 10 秒
        function scheduleHealth() {
          if (!pollingActive) return;
          if (document.hidden) {
            healthTimer = setTimeout(scheduleHealth, 10000);
            return;
          }
          checkHealth().then(
            function () {
              if (pollingActive)
                healthTimer = setTimeout(scheduleHealth, 10000);
            },
            function () {
              if (pollingActive)
                healthTimer = setTimeout(scheduleHealth, 10000);
            },
          );
        }

        function stopPolling() {
          pollingActive = false;
          if (pollTimer) {
            clearTimeout(pollTimer);
            pollTimer = null;
          }
          if (healthTimer) {
            clearTimeout(healthTimer);
            healthTimer = null;
          }
        }

        // ---------- 启动：校验令牌，无效则跳转登录页 ----------
        loadCreds();
        if (!creds.token) {
          location.href = BASE + "login.html";
        } else if (localStorage.getItem(LS.role) === "admin") {
          location.href = BASE + "admin.html";
        } else {
